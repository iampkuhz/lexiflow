<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexiFlow 字幕增强</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="assets/logo.svg" alt=""><strong>LexiFlow</strong></header>
  <main>
    <label class="toggle-row"><span class="toggle-label">当前页面字幕增强</span><input class="switch" type="checkbox" id="enhance-toggle" role="switch" aria-label="当前页面字幕增强" disabled></label>
    <div id="page-status" role="status" aria-live="polite">正在读取当前页面…</div>
    <details id="preferences"><summary>提示偏好 · 仅本机</summary>
      <p>点击中文可不再提示；仅本机、对应词库版本有效。</p>
      <button id="restore-start" type="button">恢复全部提示</button>
      <div id="restore-confirmation" hidden>
        <p>确认恢复本机所有提示偏好？</p>
        <div class="actions"><button id="restore-confirm" type="button">确认恢复</button><button id="restore-cancel" type="button">取消</button></div>
      </div>
      <div id="restore-status" role="status" aria-live="polite" hidden></div>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
