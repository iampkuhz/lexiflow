<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexiFlow 字幕增强</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="assets/logo.svg" alt=""><strong id="extension-name">LexiFlow</strong>
  </header>
  <main>
    <section id="page-section" aria-label="当前页字幕增强">
      <div class="caption-controls">
        <label class="toggle-row"><span class="toggle-label">字幕增强</span><input class="switch" type="checkbox" id="enhance-toggle" role="switch" aria-label="当前页字幕增强" disabled></label>
        <label class="caption-lines-row"><span>字幕行数</span><select id="caption-line-limit" aria-describedby="caption-line-status" disabled>
          <option value="2">2 行</option><option value="3" selected>3 行</option><option value="4">4 行</option>
        </select></label>
      </div>
      <div id="page-status" role="status" aria-live="polite">正在读取当前页面…</div>
      <div id="caption-line-status" role="status"></div>
    </section>
    <section id="service-section" aria-label="服务连接">
      <div id="backend-target" role="status" aria-live="polite">正在连接…</div>
      <div id="service-status" role="status" aria-live="polite"></div>
    </section>
    <button id="open-manage" type="button">打开管理页 <span aria-hidden="true">→</span></button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
