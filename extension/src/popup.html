<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexiFlow 字幕增强</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="assets/logo.svg" alt=""><strong>LexiFlow</strong>
    <button id="diagnostics-toggle" type="button" aria-label="连接与版本详情" aria-expanded="false" aria-controls="service-diagnostics" title="连接与版本详情">⋯</button>
  </header>
  <main>
    <section id="page-section" aria-label="当前页字幕增强">
      <label class="toggle-row"><span class="toggle-label">字幕增强</span><input class="switch" type="checkbox" id="enhance-toggle" role="switch" aria-label="当前页字幕增强" disabled></label>
      <div id="page-status" role="status" aria-live="polite">正在读取当前页面…</div>
    </section>
    <section id="summary-section" aria-label="本机偏好摘要">
      <p class="preference-summary"><span>常见词 <strong id="cutoff-summary">读取中…</strong></span><span aria-hidden="true"> · </span><span>手动隐藏 <strong id="hidden-summary">读取中…</strong></span></p>
      <div id="preference-status" role="status" hidden></div>
      <button id="open-manage" type="button">管理提示与词库 <span aria-hidden="true">→</span></button>
    </section>
    <section id="service-section" aria-label="服务连接">
      <div id="backend-target" role="status" aria-live="polite">正在连接…</div>
      <div id="service-status" role="status" aria-live="polite">正在查询服务状态…</div>
    </section>
    <section id="service-diagnostics" aria-label="连接与版本详情" hidden>
      <strong>连接与版本详情</strong>
      <div class="detail-row"><span>连接</span><span id="diagnostic-target"></span></div>
      <div id="service-identity" hidden></div>
      <button id="copy-diagnostics" type="button">复制诊断信息</button>
      <div id="copy-status" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
