    owner: LF-WS-QLT
    proposed_paths:
    - requirements-dev.txt
  current_path_claims_are_enforced: true
  path_field: proposed_paths

# 按领域阅读使命 → Epic → Capability → Task；不要按目录顺序当作执行链。
workstreams:
- id: LF-WS-ARCH
  code: ARCH
  name: "架构与决策"
  mission: "负责 Bounded Context、依赖方向、跨 Domain 流程、ADR 与架构 Gate。"
  epics:
  - id: LF-EP-ARCH-200
    name: 第二阶段提示处理主线
    capabilities:
    - id: LF-CP-ARCH-200
      name: phase2-pipeline
      phase: P2
      seed_tasks:
      - id: LF-TSK-ARCH-2001
        title: 核对用户启动通知、收尾证据与最新主干起点
        priority: P0
        phase: P2
        task_version: 1
        change_version: 1.0.0
        task_source: docs/roadmap/master-plan/phase2/tasks.md
        estimated_minutes: 30
        owner: LF-WS-ARCH
        kind: design
        lifecycle_state: DRAFT
        allowed_files: docs/roadmap/master-plan/phase2/status.md
        forbidden_files: 除 allowed_files 外的文件；其他写入者范围、真实字幕与运行数据；启动通知前禁止任何产品实现或 Git 切换
        expected_output: 记录用户启动授权、phase1 收尾依据、实际主干名与最新 tip、phase2 起点及干净隔离边界。
