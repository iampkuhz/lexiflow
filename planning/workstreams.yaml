  - scope: governance.development-docs
    owner: LF-WS-QLT
    proposed_paths:
    - docs/development/**
  - scope: governance.openspec
    owner: LF-WS-ARCH
    proposed_paths:
    - openspec/**
  - scope: governance.entrypoints
    owner: LF-WS-ARCH
    proposed_paths:
