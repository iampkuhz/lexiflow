    - id: LF-CP-QLT-003
      name: Multi-agent scheduling safety
      phase: P1
      seed_tasks:
      - id: LF-TSK-QLT-0006
        title: Implement callback-first run lifecycle and bounded watchdog
        priority: P0
        depends_on:
        - task_id: LF-TSK-QLT-0001
          type: hard
          required_task_version: 1
          required_change_version: 1.0.0
          required_result: PASS
        deliverable: Versioned layered handoff adapter and callback-first run lifecycle controller
        evidence: Full handoff-schema, caller-identity rejection, completion-before-callback, single-run,
          and 300/600-second watchdog tests
        task_version: 4
        change_version: 2.2.0
        estimated_task_minutes: 90
        acceptance_criteria:
        - Enforce the complete caller handoff schema, including task/change versions, acceptance criteria/evidence,
          and parent_client.
        - Reject caller-supplied agent_id, run_id, session_id, or client at first dispatch; bind and persist
          runner-generated identity.
        - Write a terminal completion record with task/change/run identity before callback delivery to
          the exact parent session; require the six result fields in the Qoder prompt for main-agent validation.
        - Prevent a second Qoder run while a run is active or unknown, without recursive delegation or
          LLM busy-waiting.
        - Enforce callback-first recovery with the first fallback probe no earlier than 300 seconds and
          later probes at least 600 seconds apart.
        - Derive the exact package scope and claims from current same-owner Task contracts, retain each
          Task permission, and reject omitted/extra paths, out-of-scope claims and allow/forbid conflicts
          before tool probes.
        acceptance_evidence:
        - Automated tests covering every caller field and rejection of caller-owned runtime identity.
        - Completion identity/version verification, result-field prompt contract, and completion-before-callback
          ordering tests.
        - One-active-or-unknown-Qoder-run fixtures and 300/600-second no-busy-wait watchdog tests.
        phase: P1
        task_source: Phase baseline design contract
        discovered_from: LF-TSK-QLT-0013 integrated control-plane review remediation
