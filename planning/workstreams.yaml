    proposed_paths:
    - backend/product/semantic/**
  - scope: backend.api
    owner: LF-WS-API
    proposed_paths:
    - backend/product/api/**
    - contracts/api/**
  - scope: backend.build
    owner: LF-WS-OPS
    proposed_paths:
    - backend/gradlew
    - backend/gradlew.bat
    - backend/settings.gradle.kts
    - backend/build.gradle.kts
    - backend/gradle.properties
    - backend/gradle.lockfile
    - backend/settings-gradle.lockfile
