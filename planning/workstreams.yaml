  - scope: quality.task-evidence.sec
    owner: LF-WS-SEC
    proposed_paths:
    - tmp/quality/task-evidence/SEC/**
  - scope: quality.task-evidence.sem
    owner: LF-WS-SEM
    proposed_paths:
    - tmp/quality/task-evidence/SEM/**
  - scope: governance.python-tooling
    owner: LF-WS-QLT
    proposed_paths:
    - requirements-dev.txt
  current_path_claims_are_enforced: true
  path_field: proposed_paths

# 按领域阅读使命 → Epic → Capability → Task；不要按目录顺序当作执行链。
workstreams:
- id: LF-WS-ARCH
  code: ARCH
  name: "架构与决策"
  mission: "负责 Bounded Context、依赖方向、跨 Domain 流程、ADR 与架构 Gate。"
  epics: []
- id: LF-WS-QLT
  code: QLT
  name: "Harness 与 Quality Gate"
  mission: "负责机器可读计划、Task 派发 contract、可追溯性、Gate 规划及不可变 receipt。"
  epics: []
- id: LF-WS-PRD
  code: PRD
  name: "产品体验"
  mission: "负责用户旅程、annotation 交互、无障碍及可解释性要求。"
  epics: []
- id: LF-WS-DAT
  code: DAT
  name: "数据与持久化"
  mission: "负责 PostgreSQL 事实模型、事件持久化、migration、索引及保留策略。"
  epics: []
- id: LF-WS-LEX
  code: LEX
  name: "共享 Lexicon"
  mission: "负责 lemma、phrase、meaning、frequency、CEFR、domain、technicality、alias 与 provenance。"
  epics:
  - id: LF-EP-LEX-100
    name: 基础体验
    capabilities:
    - id: LF-CP-LEX-100
      name: foundation
      phase: P1
      seed_tasks:
      - id: LF-TSK-LEX-1001
        title: 已发布资料服务契约
        priority: P0
        phase: P1
        task_version: 2
        change_version: 1.1.0
        task_source: docs/roadmap/master-plan/foundation.md
        estimated_minutes: 40
