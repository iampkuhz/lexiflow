schema_version: lexiflow.workstreams.v1
program:
  id: LF-PRG-001
  name: LexiFlow contextual English hints
  catalog_mode: execution
  source_brief: docs/product/product-brief.md
  source_roadmap: docs/roadmap/master-plan.md
  phase_definition: P1 表示当前 foundation 基础体验；不引用旧架构分层阶段或旧 Gate。
id_policy:
  program: LF-PRG-NNN
  workstream: LF-WS-{DOMAIN}
  epic: LF-EP-{DOMAIN}-NNN
  capability: LF-CP-{DOMAIN}-NNN
  task: LF-TSK-{DOMAIN}-NNNN
  run_uuid: UUID
  run_display_alias: '{task_id}-RNNN'
  acceptance_case: LF-AC-{DOMAIN}-NNN
  acceptance_case_aliases:
  - LF-{DOMAIN}-NNN
  - ARCH-NNN
  - FLOW-NNN
  - LEARN-NNN
  - SOURCE-NNN
  - FAIL-NNN
  - OBS-NNN
  immutable_rules:
  - Allocated IDs are never reused or redefined.
  - Phase, priority, milestone, and lifecycle state may change without changing ID.
  - Removed task IDs must not be reassigned to new product outcomes; source history preserves provenance.
domain_codes:
  ARCH: architecture and decisions
  QLT: agent harness, gates, and acceptance evidence
  PRD: product experience and accessibility
  DAT: persistence, events, migrations, and retention
  LEX: global lexicon
  CNT: content and caption ingestion
  ENR: enrichment pipeline
  SEM: semantic providers and model routing
  API: external API and client contracts
  EXT: Chrome Extension and YouTube adapter
  PRF: cache, latency, resilience, and cost performance
  SEC: security and privacy
  OBS: logging, metrics, tracing, and analytics
  OPS: build, deployment, release, backup, and operations
  ADP: future content adapters
priority_policy:
  P0: Required by the active gate or milestone; truth, core path, security, or data integrity.
  P1: Material quality, performance, operability, or primary experience.
  P2: Useful improvement with a documented fallback.
  P3: Exploration or future expansion; expand only when evidence triggers it.
requirement_levels:
  MUST: Required for the stated capability.
  SHOULD: Expected unless a trade-off is explicitly accepted.
  CAN_EVOLVE: Deferred until evidence justifies implementation.
lifecycle:
  planning_states:
  - DRAFT
  - READY
  - DISPATCHED
  - IN_PROGRESS
  - REVIEW
  - DONE
  - BLOCKED
  - SUPERSEDED
  - CANCELLED
  result_states:
  - PASS
  - FAIL
  - BLOCKED
  non_pass_conditions:
  - skipped
  - not-run
  - unavailable
  - excluded
  - callback-only
  - agent-exit-zero-without-review
  aggregation_order:
  - FAIL
  - BLOCKED
  - PASS
decomposition_policy:
  applies_to: catalog-task-not-agent-session
  target_implementation_run_minutes:
    min: 20
    max: 90
  target_acceptance_assertions:
    min: 1
    max: 5
  target_major_production_files_per_task:
    max: 8
  split_when:
  - More than one bounded context changes.
  - More than one primary file owner is required.
  - A provider contract and more than two consumers change together.
  - Independent validation environments are required.
  - A single implementation run is estimated above 90 minutes.
  - A discovered outcome can be accepted independently.
  keep_together:
  - Implementation and its direct tests.
  - A small sequence sharing one owner, file claim, risk, and acceptance result.
  discovery_rule: New independent scope receives a new task ID and discovered_from edge; never silently
    broaden a dispatched task.
dependency_edge_schema:
  allowed_types:
  - hard
  - soft
  - contract
  common_required_fields:
  - task_id
  - type
  - required_task_version
  - required_change_version
  hard_required_fields:
  - required_result
  soft_semantics: Advisory sequencing only; does not block READY.
  contract_required_fields:
  - contract_name
  - required_contract_version
  - required_result
  contract_producer_required_fields:
  - produced_contracts
  produced_contract_schema:
    required_fields:
    - name
    - version
    uniqueness: A producer task declares each contract name once; name and version must exactly match
      every contract consumer edge.
  version_rules:
    required_task_version: Exact positive integer producer task version.
    required_change_version: Exact producer change SemVer.
    required_contract_version: Exact consumed contract SemVer for contract edges.
dependency_policy:
  graph: DAG
  allowed_edges:
  - hard
  - soft
  - contract
  - discovered_from
  - supersedes
  hard_dependency_requires: PASS
  contract_dependency_requires_exact_version: true
  phase_number_is_not_an_implicit_dependency: true
  public_contract_changes_are_serialized: true
  integration_depends_on_all_contributors: true
orchestration_policy:
  agent_dispatch:
    primary: qoder
    fallback_model: gpt-6-sol
    fallback_reasoning_effort: high
    model_selection_basis: explicit-user-required-sol-fallback
    max_consecutive_failures: 3
    failure_unit: qoder-and-terra-both-unavailable-in-one-dispatch-attempt
    success_effect: reset-consecutive-failures-preserve-history
    identity: current-parent-repo-work-package-ordered-task-versions
    replay_effect: no-new-attempt-or-counter-increment
    unknown_start_effect: preserve-attempt-no-fallback-no-redispatch
    execution_and_review_failures: separate-from-dispatch-failures
    stop_effect: stop-package-dispatch-no-fourth-attempt-not-goal-status-change
    host_wait_policy: reject-active-or-unknown-goal-without-supported-wait-adapter
    host_wait_evidence: current-runtime-derived-read-only-goal-state
    host_wait_caller_override: forbidden
    host_mutations: forbidden
    fallback_execution_owner: current-parent-native-codex-collaboration-tool
    fallback_result_evidence: identity-bound-native-tool-result-not-self-reported-pass
    codex_wait: native-collaboration-events-not-qoder-terminal-callback
    safety_preconditions: identity-write-scope-no-duplicate-execution
  qoder:
    description: Qoder is the Coder Sub-Agent implementer.
    max_active_runs: 1
    overflow: queue
    unknown_status_blocks_new_dispatch: true
    recursive_qoder_delegation: false
    max_rework_rounds: 1
    max_total_runs_per_task_before_main_review: 2
    max_prompt_characters: 8000
    work_package_estimated_minutes:
      min: 10
      max: 360
    work_package_estimate_source: caller-declared-estimate-or-exact-current-catalog-sum-when-catalog-is-used
    minimum_catalog_tasks_per_work_package: 1
    required_agent_profile: true
    required_harness_manifest: lexiflow.qoder-harness.v1
    required_result_schema: lexiflow.qoder-work-package-result.v1
    prompt_context_policy: Use bounded file locators; do not repeat design documents in the handoff.
    rework_reuses_session_and_creates_new_run: true
  codex_subagents:
    model_policy:
      default_model: gpt-6-luna
      routine_model: gpt-6-luna
      routine_reasoning_effort: low
      routing_source: harness/agent-policy.manifest.yaml#subagent_protocol.codex_model_policy
      explicit_model_argument_required: true
      allowed_escalation_models:
      - gpt-6-sol
      user_only_models:
      - gpt-6-astra
      qoder_model_policy: separate-runner-controlled
      default_reasoning_effort: medium
    use_for:
    - bounded research
    - non-overlapping implementation
    - independent review
    - targeted validation
    parallel_writes_require_disjoint_file_claims: true
    contract_changes_are_serialized: true
    child_handoff_preserves_parent_and_task_identity: true
    max_active_subagents: 1
    default_fork_turns: none
    full_history_fork_requires_explicit_exception: true
    completion_signal_fields:
    - status
    - work_package_id
    - task_ids
    - run_id
    - artifact_locators
    - validation_commands
    - blocking_findings
    max_blocking_findings: 3
    full_context_or_logs_in_callback: false
    delegation_work_package:
      unit: coherent-set-of-catalog-tasks
      identity_fields:
      - work_package_id
      - task_ids
      work_package_id_rule: caller-stable-non-run-identity
      task_ids_rule: exact-ordered-catalog-task-identities
      per_task_outcome_evidence_required: true
      preferred_minutes:
        min: 10
        max: 360
      minimum_total_estimated_minutes: 10
      target_maximum_total_estimated_minutes: 360
      minimum_catalog_tasks: 1
      must_share:
      - primary_owner
      - contract_boundary
      - compatible_write_scope
      required_outcomes:
      - implementation_or_design
      - direct_validation
      - acceptance_evidence
      proactive_dispatch:
        threshold_minutes: 10
        prefer_when:
        - isolated-subtask-requires-large-new-context
        - acceptance-is-confirmable-by-compact-result-or-deterministic-command
        - non-overlapping-write-scope
      main_agent_only_when:
      - deterministic-task-at-or-under-10-minutes
      - isolated_read_only_review
      turn_or_token_count_is_not_acceptance_evidence: true
  main_agent:
    callback_first: true
    busy_wait_forbidden: true
    status_poll_loop_forbidden: true
    sleep_to_keep_session_open_forbidden: true
    continue_independent_work_or_end_turn_after_dispatch: true
    llm_fallback_first_probe_after_seconds: 300
    llm_fallback_min_subsequent_probe_interval_seconds: 600
    callback_may_be_processed_immediately: true
    no_llm_watchdog:
      allowed: true
      initial_delay_seconds: 300
      interval_seconds: 600
      unchanged_state_is_silent: true
    independent_review_required_for_pass: true
  handoff_contract:
    caller_required_input:
    - goal
    - task_id
    - task_source
    - task_version
    - change_version
    - work_package_id
    - task_ids
    - task_versions
    - change_versions
    - estimated_minutes
    - primary_owner
    - contract_boundary
    - agent_profile
    - harness_manifest
    - allowed_files
    - forbidden_files
    - required_context
    - expected_output
    - acceptance_criteria
    - acceptance_evidence
    - validation_command
    - failure_policy
    - parent_client
    runner_bound_identity:
      parent_session_id:
        source: caller-or-CODEX_THREAD_ID
        required_in_persisted_task: true
      agent_id:
        source: runner-generated-at-dispatch
        caller_must_omit: true
      run_id:
        source: runner-generated-at-dispatch
        caller_must_omit: true
      session_id:
        source: runner-generated-or-resume-record
        caller_must_omit_on_start: true
      client:
        source: runner-forced
        value: qoder
    result_required_output:
    - status
    - work_package_id
    - task_ids
    - task_versions
    - change_versions
    - run_id
    - outcomes
    - changed_files
    - validation
    - acceptance_evidence
    - effect_checks
    - risks
    current_runner_adapter:
      enforced_caller_fields:
      - goal
      - task_id
      - task_source
      - task_version
      - change_version
      - work_package_id
      - task_ids
      - task_versions
      - change_versions
      - estimated_minutes
      - primary_owner
      - contract_boundary
      - agent_profile
      - harness_manifest
      - allowed_files
      - forbidden_files
      - required_context
      - expected_output
      - acceptance_criteria
      - acceptance_evidence
      - validation_command
      - failure_policy
      - parent_client
      target_schema_enforced: true
      runtime_identity_enforced: true
      result_fields_required_in_prompt: true
      agent_profile_cli_binding: true
      harness_manifest_preflight: true
      catalog_package_preflight: advisory-when-present
      catalog_estimate_rule: caller-10-to-360-or-exact-current-catalog-sum-when-catalog-is-used
      structured_result_required: true
      implementation_status: IMPLEMENTED
      conformance_test: tests/agents/test_qoder_runner.py
      owner_task: LF-TSK-QLT-0006
      owner_task_version: 2
      owner_change_version: 2.0.0
    caller_field_schema:
      goal: non-empty-string
      task_id: stable-task-id-string
      task_source: non-empty-string
      task_version: positive-integer
      change_version: semver-string
      work_package_id: stable-work-package-id-string
      task_ids: ordered-unique-list-minimum-one
      task_versions: exact-task-id-to-positive-integer-map
      change_versions: exact-task-id-to-semver-map
      estimated_minutes: integer-10-to-360
      primary_owner: non-empty-string
      contract_boundary: non-empty-string
      agent_profile: project-qoder-agent-name
      harness_manifest: repository-relative-hash-bound-json
      allowed_files: non-empty-string
      forbidden_files: non-empty-string
      required_context: non-empty-string
      expected_output: non-empty-string
      acceptance_criteria: non-empty-list-of-strings
      acceptance_evidence: non-empty-list-of-strings
      validation_command: non-empty-string
      failure_policy: non-empty-string
      parent_client: exact-string-codex
change_control:
  task_id_is_stable: true
  dispatched_scope_is_immutable: true
  task_version: Increment whenever dispatched scope or acceptance changes.
  change_version:
    patch: Clarification only; no acceptance or contract change.
    minor: Compatible scope, evidence, or acceptance added.
    major: Goal, owner boundary, contract, or compatibility changed.
  max_rework_rounds_per_implementer: 1
  exhausted_rework_actions:
  - split-task
  - transfer-owner
  - main-agent-takeover
  - return-BLOCKED-to-gate
  contract_change_requires:
  - consumer inventory
  - migration tasks
  - compatibility window
  - rollback strategy
evidence_policy:
  immutable_run_directory: tmp/quality/runs/{run_uuid}/
  latest_pointer_is_not_evidence: true
  required:
  - Exact task ID, task version, change version, agent/client, and parent session.
  - Input snapshot and changed-file/file-claim reconciliation.
  - Validation commands, exit codes, logs, and typed results.
  - Acceptance-case mapping and effect checks.
  - Risk, fallback, rollback, and remaining limitations.
  - Main Agent independent review receipt.
  pass_requires_all_required_validation: true
path_ownership:
  resolution: Most-specific logical scope wins; path ownership is independent of product stage approval.
  scopes:
  - scope: governance.roadmap
    owner: LF-WS-ARCH
    proposed_paths:
    - docs/roadmap/**
    - docs/architecture/**
    - docs/adr/**
  - scope: governance.catalog
    owner: LF-WS-QLT
    proposed_paths:
    - planning/**
    - harness/**
    - scripts/repository/**
    - scripts/verification/**
    - scripts/acceptance/**
    - scripts/agents/**
    - tests/repository/**
    - tests/verification/**
    - tests/acceptance/**
    - tests/agents/**
    - tests/__init__.py
    - scripts/check_changes.py
    - scripts/check_repository.py
    - scripts/architecture-review.md
    - docs/product/product-brief.md
  - scope: product.experience
    owner: LF-WS-PRD
    proposed_paths:
    - docs/product/**
    - docs/ux/**
  - scope: backend.foundation
    owner: LF-WS-ARCH
    proposed_paths:
    - backend/modules/foundation/**
  - scope: backend.lexicon
    owner: LF-WS-LEX
    proposed_paths:
    - backend/modules/lexicon/**
  - scope: backend.content
    owner: LF-WS-CNT
    proposed_paths:
    - backend/modules/content/**
  - scope: backend.enrichment
    owner: LF-WS-ENR
    proposed_paths:
    - backend/modules/enrichment/**
  - scope: backend.semantic
    owner: LF-WS-SEM
    proposed_paths:
    - backend/modules/semantic/**
  - scope: backend.api
    owner: LF-WS-API
    proposed_paths:
    - backend/apps/api/**
    - contracts/api/**
  - scope: backend.application
    owner: LF-WS-API
    proposed_paths:
    - backend/application/**
    - backend/apps/worker/**
  - scope: backend.build
    owner: LF-WS-OPS
    proposed_paths:
    - backend/gradlew
    - backend/gradlew.bat
    - backend/settings.gradle.kts
    - backend/build.gradle.kts
    - backend/gradle.properties
    - backend/gradle.lockfile
    - backend/settings-gradle.lockfile
    - backend/gradle/**
  - scope: backend.quality
    owner: LF-WS-QLT
    proposed_paths:
    - backend/tests/**
  - scope: data.persistence
    owner: LF-WS-DAT
    proposed_paths:
    - backend/platform/adapters/src/main/java/io/lexiflow/persistence/**
    - db/**
    - infra/postgres/**
  - scope: client.chrome
    owner: LF-WS-EXT
    proposed_paths:
    - extension/**
  - scope: platform.adapters
    owner: LF-WS-OPS
    proposed_paths:
    - backend/platform/adapters/**
  - scope: platform.performance
    owner: LF-WS-PRF
    proposed_paths:
    - backend/platform/adapters/src/main/java/io/lexiflow/cache/**
    - tests/performance/**
  - scope: platform.security
    owner: LF-WS-SEC
    proposed_paths:
    - backend/platform/adapters/src/main/java/io/lexiflow/security/**
    - docs/security/**
    - tests/security/**
  - scope: platform.observability
    owner: LF-WS-OBS
    proposed_paths:
    - backend/platform/adapters/src/main/java/io/lexiflow/observability/**
    - ops/observability/**
  - scope: platform.environment
    owner: LF-WS-OPS
    proposed_paths:
    - scripts/environment/**
  - scope: platform.operations
    owner: LF-WS-OPS
    proposed_paths:
    - ops/**
    - scripts/release/**
    - .github/**
    - infra/local/**
  - scope: adapter.future
    owner: LF-WS-ADP
    proposed_paths:
    - clients/adapters/**
    - backend/modules/content/adapters/**
  - scope: governance.development-docs
    owner: LF-WS-QLT
    proposed_paths:
    - docs/development/**
  - scope: governance.openspec
    owner: LF-WS-ARCH
    proposed_paths:
    - openspec/**
  - scope: governance.entrypoints
    owner: LF-WS-ARCH
    proposed_paths:
    - AGENTS.md
    - README.md
    - .gitignore
    - docs/README.md
  - scope: governance.agent-entrypoints
    owner: LF-WS-QLT
    proposed_paths:
    - .codex/**
    - .qoder/**
  - scope: quality.task-evidence.adp
    owner: LF-WS-ADP
    proposed_paths:
    - tmp/quality/task-evidence/ADP/**
  - scope: quality.task-evidence.arch
    owner: LF-WS-ARCH
    proposed_paths:
    - tmp/quality/task-evidence/ARCH/**
  - scope: quality.task-evidence.obs
    owner: LF-WS-OBS
    proposed_paths:
    - tmp/quality/task-evidence/OBS/**
  - scope: quality.task-evidence.ops
    owner: LF-WS-OPS
    proposed_paths:
    - tmp/quality/task-evidence/OPS/**
  - scope: quality.task-evidence.prd
    owner: LF-WS-PRD
    proposed_paths:
    - tmp/quality/task-evidence/PRD/**
  - scope: quality.task-evidence.prf
    owner: LF-WS-PRF
    proposed_paths:
    - tmp/quality/task-evidence/PRF/**
  - scope: quality.task-evidence.qlt
    owner: LF-WS-QLT
    proposed_paths:
    - tmp/quality/task-evidence/QLT/**
  - scope: quality.task-evidence.sec
    owner: LF-WS-SEC
    proposed_paths:
    - tmp/quality/task-evidence/SEC/**
  - scope: quality.task-evidence.sem
    owner: LF-WS-SEM
    proposed_paths:
    - tmp/quality/task-evidence/SEM/**
  - scope: governance.python-tooling
    owner: LF-WS-QLT
    proposed_paths:
    - requirements-dev.txt
  current_path_claims_are_enforced: true
  path_field: proposed_paths
workstreams:
- id: LF-WS-ARCH
  code: ARCH
  name: Architecture and decisions
  mission: Own bounded contexts, dependency direction, cross-domain flows, ADRs, and architecture gates.
  epics: []
- id: LF-WS-QLT
  code: QLT
  name: Harness and quality gates
  mission: Own machine-readable planning, task dispatch contracts, traceability, gate planning, and immutable
    receipts.
  epics: []
- id: LF-WS-PRD
  code: PRD
  name: Product experience
  mission: Own user journeys, annotation interaction, accessibility, and explainability expectations.
  epics: []
- id: LF-WS-DAT
  code: DAT
  name: Data and persistence
  mission: Own PostgreSQL source-of-truth models, event persistence, migrations, indexing, retention,
    and retention.
  epics: []
- id: LF-WS-LEX
  code: LEX
  name: Global lexicon
  mission: Own lemma, phrase, meaning, frequency, CEFR, domain, technicality, aliases, and provenance.
  epics:
  - id: LF-EP-LEX-100
    name: 基础体验
    capabilities:
    - id: LF-CP-LEX-100
      name: foundation
      phase: P1
      seed_tasks:
      - id: LF-TSK-LEX-1001
        title: 已发布资料服务契约
        priority: P0
        phase: P1
        task_version: 1
        change_version: 1.0.0
        task_source: docs/roadmap/master-plan/foundation.md
        estimated_minutes: 40
        allowed_files: backend/modules/lexicon/**, backend/application/lexicon/**, backend/platform/adapters/**
        forbidden_files: 除 allowed_files 外的所有文件；尤其 AGENTS.md、harness/**、planning/** 与其他写入者范围
        expected_output: 去除首义便利接口；数据库版本与真实资料使用安全，导入不猜义。
        acceptance_criteria:
        - 去除首义便利接口；数据库版本与真实资料使用安全，导入不猜义。
        acceptance_evidence:
        - 直接测试结果、冻结 diff 与独立审查；执行状态只见路线图状态页
        validation_command: python3 -m scripts.environment.java_exec backend/gradlew -p backend check
        required_check_ids:
        - eng.backend.delivery
        - eng.repository.docs
        - eng.repository.planning
        - eng.repository.policy
        dependencies: []
        depends_on: []
- id: LF-WS-CNT
  code: CNT
  name: Content and captions
  mission: Own normalized content, caption timelines, context windows, provenance, and source-adapter
    ports.
  epics: []
- id: LF-WS-ENR
  code: ENR
  name: Enrichment engine
  mission: Own candidate generation, need-hint decisions, contextual meaning assembly, and annotation
    output.
  epics:
  - id: LF-EP-ENR-100
    name: 基础体验
    capabilities:
    - id: LF-CP-ENR-100
      name: foundation
      phase: P1
      seed_tasks:
      - id: LF-TSK-ENR-1001
        title: 可靠词义资格与歧义放弃
        priority: P0
        phase: P1
        task_version: 3
        change_version: 1.2.0
        task_source: docs/roadmap/master-plan/foundation.md
        estimated_minutes: 40
        allowed_files: backend/modules/enrichment/**
        forbidden_files: 除 allowed_files 外的所有文件；尤其 AGENTS.md、harness/**、planning/** 与其他写入者范围
        expected_output: 单一简短中文表达可用；完全重复领域表达归并；不同义项、非法列表与同范围词条歧义放弃。
        acceptance_criteria:
        - 单一简短中文表达可用；完全重复领域表达归并；不同义项、非法列表与同范围词条歧义放弃。
        - 通用功能词和基础副词不占提示；别名、词形不能绕过；完整可靠短语不误伤。
        acceptance_evidence:
        - 直接测试结果、冻结 diff 与独立审查；执行状态只见路线图状态页
        validation_command: python3 -m scripts.environment.java_exec backend/gradlew -p backend :modules:enrichment:test
        required_check_ids:
        - eng.backend.delivery
        - eng.repository.docs
        - eng.repository.planning
        - eng.repository.policy
        dependencies: []
        depends_on: []
      - id: LF-TSK-ENR-1002
        title: 稳定词段匹配与展示上限
        priority: P0
        phase: P1
        task_version: 1
        change_version: 1.0.0
        task_source: docs/roadmap/master-plan/foundation.md
        estimated_minutes: 40
