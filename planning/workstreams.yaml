phase_entry_validation:
  effective_phase: task.phase overrides capability.phase
  entry_task_definition: A P2-P6 task with no blocking hard/contract dependency in the same effective
    phase before the previous-gate edge is applied.
  approval_evidence_inheritance:
    source: phase_gates[].entry_requires.approval_evidence_type
    target: matching P2-P6 entry tasks
    task_level_override_allowed: false
  rules:
  - Every declared phase entry task has a direct hard dependency on the immediately previous Gate exit
    task.
  - The direct edge pins required_task_version, required_change_version, and required_result=PASS.
  - phase_entry_prerequisite pins previous_gate_id, exit task/version, required_gate_result=PASS, and
    required_user_approval=APPROVED.
  - Entry tasks inherit approval_evidence_type from the matching phase_gates[].entry_requires; task-level
    phase_entry_prerequisite must not redeclare or override it.
  - READY validation fails unless both the exit-task receipt and explicit approval receipt resolve.
  - Every non-entry P2-P6 task has a transitive blocking ancestry path to at least one valid entry task
    in its own phase.
  - The phase Gate exit task has transitive blocking ancestry to every P0 entry task in that phase, or
    a versioned exception approved by the user.
  entry_tasks:
    P2:
    - LF-TSK-DAT-0001
    - LF-TSK-LEX-0001
    - LF-TSK-CNT-0001
    - LF-TSK-SEC-0002
    P3:
    - LF-TSK-API-0001
    P4:
    - LF-TSK-LEX-0003
    - LF-TSK-CNT-0003
    - LF-TSK-CNT-0004
    - LF-TSK-ENR-0001
    - LF-TSK-SEM-0003
    - LF-TSK-SEM-0005
    - LF-TSK-PRF-0003
    - LF-TSK-SEC-0003
    - LF-TSK-OBS-0004
    P5:
    - LF-TSK-PRD-0003
