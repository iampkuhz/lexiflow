        - 通过事务 afterCompletion 的实际回滚信号区分已确认回滚与未知内部失败；来源身份不符用类型化 SOURCE_CHANGED，取消信号用 CANCELLED，不从异常消息匹配原因，不把全部异常伪报回滚。
