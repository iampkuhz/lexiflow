      - id: LF-TSK-QLT-2499
        title: 修复首次 initdb 中断后的安全重试
        priority: P0
        task_version: 1
        change_version: 1.0.0
        task_source: openspec/changes/single-container-host-home/tasks.md
        estimated_minutes: 45
        kind: implementation
        lifecycle_state: READY
        allowed_files:
        - ops/docker/runtime-entrypoint.sh
        - ops/podman/tests/candidate-runtime.test.mjs
        - tmp/phase-tools/single-container-host-home/initdb-recovery/**
        forbidden_files: [secrets/**, .local/**, data/**, .env]
        expected_output: 从未启动数据库的已归属部分 initdb 可安全重试，已完成 initdb 或已发布数据不得清空。
        deliverable: 格式2卷的初始化完成协议、直接故障回归与当次证据。
        acceptance_criteria:
        - initdb 完成必须在首次启动 PostgreSQL 前持久原子记录；仅格式2、合法归属、未完成 initdb 且无 ready/pending-ready 的目录可重建。
        - PG_VERSION 单独存在不能证明 initdb 完成；完成或 pending 完成标记严格校验，损坏、未知内容与旧格式不修改而失败关闭。
        - 覆盖 PG_VERSION 已写但系统库未建的真实接缝、成功重试、完成后不重导、不清理已发布事实、旧格式和损坏状态拒绝。
        - 不增加产品进程或自由路径参数，不变更 Check/预算/就绪门禁，保留先前21项 Node 回归与所有失败证据。
        acceptance_evidence:
        - 旧实现直接行为 RED、新实现 GREEN、真实原生绑定与原始日志，未运行正式候选的限制明确。
        validation_command: node --test ops/podman/tests/candidate-runtime.test.mjs
        required_check_ids: [eng.release.docker-contract]
        discovered_from: LF-TSK-OPS-2076
        depends_on: []
