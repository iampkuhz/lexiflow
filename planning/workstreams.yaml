schema_version: lexiflow.workstreams.v1
program:
  id: LF-PRG-001
  name: LexiFlow 英文语境提示
  catalog_mode: execution
  source_brief: docs/system/experience.md
  source_roadmap: docs/roadmap/master-plan.md
  phase_definition: P1 为 foundation 基础体验；P2 为提示处理主线、功能分层与 macOS 调试/Docker 发布闭环。任务草案不代表验收通过，启动与集成约束见 docs/roadmap/master-plan/phase2/tasks.md；后续事项不预分期。
domain_codes:
  ARCH: 架构与决策
  QLT: Agent Harness、Quality Gate 与验收证据
  PRD: 产品体验与无障碍
  DAT: 持久化、事件、migration 与保留策略
  LEX: 共享 Lexicon
  CNT: 内容与字幕采集
  ENR: Enrichment pipeline
  SEM: Semantic Provider 与模型路由
  API: 外部 API 与客户端 contract
  EXT: Chrome Extension 与 YouTube adapter
  PRF: 缓存、延迟、韧性与成本性能
  SEC: 安全与隐私
  OBS: 日志、metrics、tracing 与分析
  OPS: 构建、部署、发布、备份与运维
  ADP: 后续 Content Adapter
