    - README.md
    - .gitignore
    - docs/README.md
  - scope: governance.agent-entrypoints
    owner: LF-WS-QLT
    proposed_paths:
    - .codex/**
    - .qoder/**
  - scope: quality.task-evidence.adp
    owner: LF-WS-ADP
    proposed_paths:
    - tmp/quality/task-evidence/ADP/**
  - scope: quality.task-evidence.arch
    owner: LF-WS-ARCH
