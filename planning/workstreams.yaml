workstreams:
- id: LF-WS-ARCH
  code: ARCH
  name: 架构与决策
  mission: 负责 Bounded Context、依赖方向、跨 Domain 流程、ADR 与架构 Gate。
  epics:
  - id: LF-EP-ARCH-200
    name: 第二阶段提示处理主线
    capabilities:
    - id: LF-CP-ARCH-200
      name: phase2-pipeline
      phase: P2
      seed_tasks:
      - id: LF-TSK-ARCH-2001
        title: 核对用户启动通知、收尾证据与最新主干起点
        priority: P0
        task_version: 4
        change_version: 3.1.0
        task_source: docs/roadmap/master-plan/phase2/tasks.md
        estimated_minutes: 30
        kind: design
        lifecycle_state: DRAFT
        allowed_files:
        - docs/roadmap/master-plan/phase2/status.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 记录用户启动授权、phase1 收尾依据、实际主干名与最新 tip、phase2 起点及干净隔离边界。
        acceptance_criteria:
        - 依据明确的二期启动授权执行；记录一期验收缺口，不把开发授权或自动续轮当作一期 PASS。
        - 核对远端最新 main 后创建 phase2，子任务使用 phase2-N-主题；不从一期工作分支派生。
        - 核对分支归属和并发修改；按已授权范围精确提交并及时合回 phase2，不覆盖他人工作、不推送或合回 main。
        acceptance_evidence:
        - 逐条验收对应的冻结输入、直接检查与独立复核证据；执行状态仅记录 phase2/status.md，不以草案建立或旧 P1 receipt 代替 PASS
        validation_command: python3 -m scripts.checks.repository.catalog.check_task_catalog && python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-QLT-2003
          type: hard
          required_task_version: 3
          required_change_version: 2.1.0
          required_result: PASS
        - task_id: LF-TSK-QLT-2005
          type: hard
          required_task_version: 2
          required_change_version: 1.1.0
          required_result: PASS
        deliverable: 记录用户启动授权、phase1 收尾依据、实际主干名与最新 tip、phase2 起点及干净隔离边界。
      - id: LF-TSK-ARCH-2002
        title: 冻结词段分类、预处理资格及排序规则表
        priority: P0
        task_version: 2
        change_version: 1.1.0
        task_source: docs/roadmap/master-plan/phase2/tasks.md
        estimated_minutes: 75
        kind: design
        lifecycle_state: DRAFT
        allowed_files:
        - docs/roadmap/master-plan/phase2/design.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 按五个独立维度给出确定规则、来源字段、边界样例和批准的行为变更清单。
        acceptance_criteria:
        - 区分单词/短语、基础/重点/长尾、低频/未知频率、资料质量、提示与缓存；基础不等于用户熟练。
        - 明确基础名单依据、重点条件与排序、短语质量、默认首义、具体阻断原因及词形继承；低频或缺少排名不单独阻断。
        - 冻结阈值和优先级的依据及合成验收样例，不凭讨论臆造概率或个人画像；越出已批准范围先提交用户决策。
        acceptance_evidence:
        - 逐条验收对应的冻结输入、直接检查与独立复核证据；执行状态仅记录 phase2/status.md，不以草案建立或旧 P1 receipt 代替 PASS
        validation_command: python3 -m scripts.checks.repository.catalog.check_task_catalog && python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-ARCH-2001
          type: hard
          required_task_version: 4
          required_change_version: 3.1.0
          required_result: PASS
        deliverable: 按五个独立维度给出确定规则、来源字段、边界样例和批准的行为变更清单。
      - id: LF-TSK-ARCH-2003
        title: 冻结预处理、启动、同步主线与跨模块接口
        priority: P0
        task_version: 2
        change_version: 1.1.0
        task_source: docs/roadmap/master-plan/phase2/tasks.md
        estimated_minutes: 90
        kind: design
        lifecycle_state: DRAFT
        allowed_files:
        - docs/roadmap/master-plan/phase2/design.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 每节点的输入输出、owner、调用次序、失败出口和版本合同；列出全部消费者及串行切换顺序。
        acceptance_criteria:
        - 分别明确预处理、启动与请求七步流程；静态质量判断前移，范围、版本及响应安全检查保留在运行期。
        - 冻结准确词形查询端口、发布投影、诊断和敏感记录接口；现有消费者完整盘点，不造空壳多义项接口。
        - 明确正式/演示模式、无发布版本、依赖故障、预热失败、版本冲突的唯一行为；不隐式导入或重建。
        - 查词默认义仍非上下文消歧；异步 Promise/线程若服务当前提示仍属于关键路径。
        acceptance_evidence:
        - 逐条验收对应的冻结输入、直接检查与独立复核证据；执行状态仅记录 phase2/status.md，不以草案建立或旧 P1 receipt 代替 PASS
        validation_command: python3 -m scripts.checks.repository.catalog.check_task_catalog && python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-ARCH-2002
          type: hard
          required_task_version: 2
          required_change_version: 1.1.0
          required_result: PASS
        deliverable: 每节点的输入输出、owner、调用次序、失败出口和版本合同；列出全部消费者及串行切换顺序。
      - id: LF-TSK-ARCH-2004
        title: 按冻结主线形成架构和执行时序图
        priority: P0
        task_version: 2
        change_version: 1.1.0
        task_source: docs/roadmap/master-plan/phase2/tasks.md
        estimated_minutes: 60
        kind: design
        lifecycle_state: DRAFT
        allowed_files:
        - docs/roadmap/master-plan/phase2/architecture.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 功能分层、观看时序、资料生产与发布时序的内嵌 PlantUML 图及节点到责任映射。
        acceptance_criteria:
        - 图源来自冻结的分类和流程结论；说明当前提示关键路径、独立离线链及发布身份交接，不按线程创建业务服务。
        - 按 documentation-policy 和指定 skill 在 ignored 目录渲染并实际查看后原样入正文；缺工具或预览为 BLOCKED，不以静态围栏检查代替视觉验收。
        acceptance_evidence:
        - 逐条验收对应的冻结输入、直接检查与独立复核证据；执行状态仅记录 phase2/status.md，不以草案建立或旧 P1 receipt 代替 PASS
        validation_command: python3 -m scripts.checks.repository.catalog.check_task_catalog && python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-ARCH-2003
          type: hard
          required_task_version: 2
          required_change_version: 1.1.0
          required_result: PASS
        - task_id: LF-TSK-OBS-2001
          type: hard
          required_task_version: 2
          required_change_version: 1.1.0
          required_result: PASS
        deliverable: 功能分层、观看时序、资料生产与发布时序的内嵌 PlantUML 图及节点到责任映射。
      - id: LF-TSK-ARCH-2005
        title: 同步最终功能文档并核对阶段交付证据
        priority: P0
        task_version: 3
        change_version: 2.1.0
        task_source: docs/roadmap/master-plan/phase2/tasks.md
        estimated_minutes: 60
        kind: design
        lifecycle_state: DRAFT
        allowed_files:
        - docs/system.md
        - docs/system/**
        - docs/roadmap/**
        - openspec/specs/product-architecture/spec.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 最终文档与冻结实现一致，P2 各项证据、限制、用户验收及未来待办归属清楚。
        acceptance_criteria:
        - 清理分散的第二/第三阶段归属陈述；图文只描述已确定主线，模型/隐私护栏不放宽。
        - 区分静态检查、合成集成、真实页面与正式 receipt；不自签独立 validation/review，不将规划完成当产品完成。
        - 未选入本阶段的性能、多义项、上下文和知识补充事项仍在后续池；不得宣布其已实现。
        acceptance_evidence:
        - 逐条验收对应的冻结输入、直接检查与独立复核证据；执行状态仅记录 phase2/status.md，不以草案建立或旧 P1 receipt 代替 PASS
        validation_command: python3 -m scripts.checks.repository.catalog.check_task_catalog && python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-QLT-2002
          type: hard
          required_task_version: 3
          required_change_version: 1.2.0
          required_result: PASS
        - task_id: LF-TSK-QLT-2001
          type: hard
          required_task_version: 5
          required_change_version: 3.2.0
          required_result: PASS
        - task_id: LF-TSK-ARCH-2004
          type: hard
          required_task_version: 2
          required_change_version: 1.1.0
          required_result: PASS
        deliverable: 最终文档与冻结实现一致，P2 各项证据、限制、用户验收及未来待办归属清楚。
      - id: LF-TSK-ARCH-2006
        title: 冻结双运行形式、发布身份和使用闭环合同
        priority: P0
        task_version: 2
        change_version: 1.1.0
        task_source: docs/roadmap/master-plan/phase2/release.md
        estimated_minutes: 60
        kind: design
        lifecycle_state: DRAFT
        allowed_files:
        - docs/roadmap/master-plan/phase2/release.md
        - docs/roadmap/master-plan/phase2/design.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 冻结双运行形式、发布身份和使用闭环合同及直接验收证据。
        acceptance_criteria:
        - 确定 macOS 调试与 Docker 发布共用业务链、容器端口/资料/隐私边界；不制作桌面安装包，不自动开放公网。
        - 冻结版本真源、镜像/资料/扩展清单、首次初始化、更新恢复及卸载的输入输出和失败动作。
        - 明确 linux amd64/arm64 验证、资源预算及必需发布凭据；没有实测/外部许可不得标为支持或正式发布。
        acceptance_evidence:
        - 冻结输入、直接测试与隔离运行证据；状态仅在 phase2/status.md，未运行的必需项为 BLOCKED，不以构建成功代替用户验收
        validation_command: python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-ARCH-2003
          type: hard
          required_task_version: 2
          required_change_version: 1.1.0
          required_result: PASS
        deliverable: 冻结双运行形式、发布身份和使用闭环合同及直接验收证据。
      - id: LF-TSK-ARCH-2007
        title: 编写双运行入口和用户安装更新指南
        priority: P0
        task_version: 3
        change_version: 2.1.0
        task_source: docs/roadmap/master-plan/phase2/release.md
        estimated_minutes: 60
        kind: design
        lifecycle_state: READY
        allowed_files:
        - README.md
        - docs/user/podman-macos.md
        - docs/roadmap/master-plan/phase2/release.md
        - docs/scenarios/local-development.md
        - docs/scenarios/docker-release.md
        forbidden_files:
        - secrets/**
        - .local/**
        - data/**
        - .env
        expected_output: 编写双运行入口和用户安装更新指南及直接验收证据。
        acceptance_criteria:
        - 根 README 优先给出 Docker 使用者取得产物、启动和扩展安装的最短流程，macOS 开发调试按需下钻。
        - 初始化、版本、数据卷、恢复和卸载均有成功判据与失败去向；明确 Docker 环境依赖及扩展实际安装限制。
        acceptance_evidence:
        - 冻结输入、直接测试与隔离运行证据；状态仅在 phase2/status.md，未运行的必需项为 BLOCKED，不以构建成功代替用户验收
        validation_command: python3 -m scripts.checks.repository.documentation.check_documentation
        required_check_ids:
        - eng.repository.docs
        - eng.repository.planning
        depends_on:
        - task_id: LF-TSK-QLT-2004
          type: hard
          required_task_version: 4
          required_change_version: 3.1.0
          required_result: PASS
        - task_id: LF-TSK-OPS-2008
          type: hard
          required_task_version: 5
          required_change_version: 3.2.0
          required_result: PASS
        deliverable: 编写双运行入口和用户安装更新指南及直接验收证据。
- id: LF-WS-QLT
  code: QLT
  name: Harness 与 Quality Gate
  mission: 负责机器可读计划、Task 派发 contract、可追溯性、Gate 规划及不可变 receipt。
  epics:
  - id: LF-EP-QLT-200
    name: 第二阶段提示处理主线
    capabilities:
    - id: LF-CP-QLT-200
      name: phase2-pipeline
      phase: P2
      seed_tasks:
      - id: LF-TSK-QLT-2408
        title: 修正真实弹窗测试的点击准备竞态
        priority: P0
        task_version: 1
        change_version: 1.0.0
        task_source: openspec/changes/first-release-v2/tasks.md
        estimated_minutes: 25
        kind: implementation
        lifecycle_state: READY
        allowed_files:
        - extension/tests/action-popup.mjs
        - extension/tests/action-popup.test.mjs
        - planning/workstreams.yaml
