# Task 填写模板；占位符须替换为实际值，不能直接作为派发输入。
# 先确定 goal/scope/acceptance，再填 execution；身份字段由真实 runner 绑定。
# 共享投影保持与 policy 一致，新增 Task 不等于得到阶段批准。
schema_version: "lexiflow.task.v1"


# 稳定身份与版本；标题用结果描述，不用一组模糊动作。
identity:
  program_id: "LF-PRG-001"
  workstream_id: "LF-WS-<DOMAIN>"
  epic_id: "LF-EP-<DOMAIN>-NNN"
  capability_id: "LF-CP-<DOMAIN>-NNN"
  task_id: "LF-TSK-<DOMAIN>-NNNN"
  task_version: 1
  change_version: "1.0.0"
  title: "<单一可验证的结果>"
  task_source: "<已批准的 Gate、路线图项、缺陷或 discovered_from Task>"
  discovered_from: null
  supersedes: null


# 分类用于计划组织；不隐式授予阶段或 Gate 权限。
classification:
  phase: "<明确批准的 Task 阶段>"
  gate: null
  milestone_slices: []
  priority: "P0"
  requirement_level: "MUST"
  kind: "design"
  lifecycle_state: "DRAFT"
  risk_level: "medium"
  concurrency_group: "<contract 或路径锁名称>"


# 先说明问题、可观察结果及不做什么。
goal:
  problem: "<当前缺失或错误的问题>"
  outcome: "<完成后可观察的状态>"
  non_goals:
    - "<明确排除的行为>"
  assumptions:
    - id: "ASM-001"
      statement: "<假设>"
      validation: "<验证方式与时间>"


# 写入范围、禁止范围和必需上下文；窄范围路径便于并发隔离。
scope:
  logical_scopes:
    - "<已在 workstreams.yaml.path_ownership 登记的范围>"
  allowed_files:
    - "<精确文件或窄范围 glob>"
  forbidden_files:
    - "<受保护或超出 owner 的路径>"
  required_context:
    - "docs/roadmap/master-plan.md"
    - "planning/workstreams.yaml"
  file_claims:
    - path: "<精确路径或窄范围 glob>"
      mode: "write"
      owner: "LF-WS-<DOMAIN>"

ownership:
  primary_owner: "LF-WS-<DOMAIN>"
  contract_owner: "LF-WS-<DOMAIN>"
  reviewers:
    - "<独立的 Domain、质量、安全或隐私 owner>"
  integration_owner: "LF-WS-QLT"


# 依赖绑定精确版本；soft 边只建议顺序，不制造额外阻断。
dependencies:
  depends_on:
    - task_id: "LF-TSK-<DOMAIN>-NNNN"
      type: "hard"
      required_task_version: 1
      required_change_version: "1.0.0"
      required_result: "PASS"
    - task_id: "LF-TSK-<DOMAIN>-NNNN"
      type: "soft"
      required_task_version: 1
      required_change_version: "1.0.0"
    - task_id: "LF-TSK-<DOMAIN>-NNNN"
      type: "contract"
      required_task_version: 1
      required_change_version: "1.0.0"
      required_result: "PASS"
      contract_name: "<schema、API、event、Provider 或 UI contract>"
      required_contract_version: "1.0.0"
  allowed_types: ["hard", "soft", "contract"]

produced_contracts:
  - name: "<contract 边所消费的名称>"
    version: "1.0.0"
contract_producer_rule: "每条 contract 边必须唯一对应一个 producer 声明；其 name 和 version 必须与 contract_name、required_contract_version 精确匹配。"

# 阶段编号或历史 Gate 批准不会隐式激活 Task。
# 分解实际工作时，显式声明已批准的前置条件。
phase_entry_prerequisite: null


# 非平凡决策记录唯一结论、代价与重新评估条件。
decision_record:
  required: false
  required_when:
    - "Task 涉及重要的架构、contract、安全、数据或成本决策。"
    - "阶段 Gate 要求记录确定的决策、trade-off 理由与重新评估条件。"
  selected_decision: "<已确定的唯一方案>"
  trade_off_rationale: "<接受的成本或边界及其理由>"
  revisit_condition: "<触发新 OpenSpec 决策的可观察条件>"
  user_confirmation_required: false
  user_confirmation_required_when:
    - "Task 本身是阶段 Gate。"
    - "决策改变用户已批准的范围或产品行为。"

deliverables:
  - id: "DEL-001"
    description: "<具体产物或行为>"
    path_or_locator: "<路径、receipt、URL 或命令输出>"


# 把交付物映射到可观察断言、确定性命令与证据。
acceptance:
  criteria:
    - id: "LF-AC-<DOMAIN>-NNN"
      statement: "<单一可观察断言>"
      evidence_type: "automated_test"
      evidence_locator: "<测试 ID、receipt key、文档章节、metric 或截图>"
  legacy_id_policy: "已有 LF-<DOMAIN>-NNN 与 ARCH/FLOW/LEARN/SOURCE/TENANT/FAIL/OBS-NNN 保持有效且不可变。"
  validation_commands:
    - command: "<确定性命令>"
      required: true
      timeout_seconds: 600
      expected: "退出码为 0，且所有断言均已执行。"
  effect_checks:
    behavior: "<预期行为检查>"
    regression: "<受影响的回归范围>"
    performance: "<预算或不适用原因>"
    security_privacy: "<检查或不适用原因>"
    data_migration: "<检查或不适用原因>"
  skipped_semantics: "skipped、not-run、unavailable 或 excluded 均不能产生 PASS。"


# 执行配置；共享 agent_dispatch 和 model_policy 值由 policy 投影。
execution:
  agent_dispatch:
    primary: qoder
    fallback_model: gpt-6-sol
    fallback_reasoning_effort: high
    model_selection_basis: explicit-user-required-sol-fallback
    max_consecutive_failures: 3
    failure_unit: qoder-and-terra-both-unavailable-in-one-dispatch-attempt
    success_effect: reset-consecutive-failures-preserve-history
    identity: current-parent-repo-work-package-ordered-task-versions
    replay_effect: no-new-attempt-or-counter-increment
    unknown_start_effect: preserve-attempt-no-fallback-no-redispatch
    execution_and_review_failures: separate-from-dispatch-failures
    stop_effect: stop-package-dispatch-no-fourth-attempt-not-goal-status-change
    host_wait_policy: reject-active-or-unknown-goal-without-supported-wait-adapter
    host_wait_evidence: current-runtime-derived-read-only-goal-state
    host_wait_caller_override: forbidden
    host_mutations: forbidden
    fallback_execution_owner: current-parent-native-codex-collaboration-tool
    fallback_result_evidence: identity-bound-native-tool-result-not-self-reported-pass
    codex_wait: native-collaboration-events-not-qoder-terminal-callback
    safety_preconditions: identity-write-scope-no-duplicate-execution
  preferred_implementer: "qoder"
  fallback_implementer: "main-agent"
  estimated_task_minutes: 45
  allowed_task_minutes: {min: 20, max: 90}
  expected_run_kinds: ["implementation", "independent_review"]
  qoder:
    max_active_program_runs: 1
    recursive_delegation: false
    permission_mode: "bypass_permissions"
    max_rework_rounds: 1
    max_total_runs_per_task_before_main_review: 2
    max_prompt_characters: 8000
    dispatch_unit: "coherent-work-package"
    work_package_estimated_minutes:
      min: 10
      max: 360
    work_package_estimate_source: caller-declared-estimate-or-exact-current-catalog-sum-when-catalog-is-used
    minimum_catalog_tasks: 1
    agent_profile_required: true
    harness_manifest_required: true
    structured_result_required: true
    prompt_context_policy: 使用有界的文件 locator；handoff 不重复粘贴设计文档。
    resume_same_session_for_rework: true
  codex_subagent:
    allowed: true
    model_policy:
      default_model: gpt-6-luna
      routine_model: gpt-6-luna
      routine_reasoning_effort: low
      routing_source: harness/agent-policy.manifest.yaml#subagent_protocol.codex_model_policy
      explicit_model_argument_required: true
      allowed_escalation_models:
      - gpt-6-sol
      user_only_models:
      - gpt-6-astra
      qoder_model_policy: separate-runner-controlled
      default_reasoning_effort: medium
    requires_non_overlapping_write_scope: true
    may_delegate_only_independent_subtasks: true
    max_active_subagents: 1
    default_fork_turns: "none"
    full_history_fork_requires_explicit_exception: true
    completion_signal_fields: [status, work_package_id, task_ids, run_id, artifact_locators, validation_commands,
      blocking_findings]
    max_blocking_findings: 3
    full_context_or_logs_in_callback: false
    delegation_work_package:
      unit: coherent-set-of-catalog-tasks
      identity_fields:
      - work_package_id
      - task_ids
      work_package_id_rule: caller-stable-non-run-identity
      task_ids_rule: exact-ordered-catalog-task-identities
      per_task_outcome_evidence_required: true
      preferred_minutes:
        min: 10
        max: 360
      minimum_total_estimated_minutes: 10
      target_maximum_total_estimated_minutes: 360
      minimum_catalog_tasks: 1
      must_share:
      - primary_owner
      - contract_boundary
      - compatible_write_scope
      required_outcomes:
      - implementation_or_design
      - direct_validation
      - acceptance_evidence
      proactive_dispatch:
        threshold_minutes: 10
        prefer_when:
        - isolated-subtask-requires-large-new-context
        - acceptance-is-confirmable-by-compact-result-or-deterministic-command
        - non-overlapping-write-scope
      main_agent_only_when:
      - deterministic-task-at-or-under-10-minutes
      - isolated_read_only_review
      turn_or_token_count_is_not_acceptance_evidence: true
  main_session:
    callback_first: true
    busy_wait_forbidden: true
    end_turn_when_no_independent_work: true
    fallback_first_probe_after_seconds: 300
    fallback_min_subsequent_probe_interval_seconds: 600
    no_llm_watchdog_allowed: true


# caller 只提供工作包信息；runner 生成并绑定身份，不手写假身份。
handoff_contract:
  caller_required_input:
  - goal
  - task_id
  - task_source
  - task_version
  - change_version
  - work_package_id
  - task_ids
  - task_versions
  - change_versions
  - estimated_minutes
  - primary_owner
  - contract_boundary
  - agent_profile
  - harness_manifest
  - allowed_files
  - forbidden_files
  - required_context
  - expected_output
  - acceptance_criteria
  - acceptance_evidence
  - validation_command
  - failure_policy
  - parent_client
  runner_bound_identity:
    parent_session_id:
      source: "caller-or-CODEX_THREAD_ID"
      required_in_persisted_task: true
    agent_id:
      source: "runner-generated-at-dispatch"
      caller_must_omit: true
    run_id:
      source: "runner-generated-at-dispatch"
      caller_must_omit: true
    session_id:
      source: "runner-generated-or-resume-record"
      caller_must_omit_on_start: true
    client:
      source: "runner-forced"
      value: "qoder"
  result_required_output:
  - status
  - work_package_id
  - task_ids
  - task_versions
  - change_versions
  - run_id
  - outcomes
  - changed_files
  - validation
  - acceptance_evidence
  - effect_checks
  - risks
  current_runner_adapter:
    enforced_caller_fields:
    - goal
    - task_id
    - task_source
    - task_version
    - change_version
    - work_package_id
    - task_ids
    - task_versions
    - change_versions
    - estimated_minutes
    - primary_owner
    - contract_boundary
    - agent_profile
    - harness_manifest
    - allowed_files
    - forbidden_files
    - required_context
    - expected_output
    - acceptance_criteria
    - acceptance_evidence
    - validation_command
    - failure_policy
    - parent_client
    target_schema_enforced: true
    runtime_identity_enforced: true
    result_fields_required_in_prompt: true
    agent_profile_cli_binding: true
    harness_manifest_preflight: true
    catalog_package_preflight: advisory-when-present
    catalog_estimate_rule: caller-10-to-360-or-exact-current-catalog-sum-when-catalog-is-used
    structured_result_required: true
    implementation_status: IMPLEMENTED
    conformance_test: tests/agents/test_qoder_runner.py
    owner_task: LF-TSK-QLT-0006
    owner_task_version: 2
    owner_change_version: 2.0.0
  caller_field_schema:
    goal: non-empty-string
    task_id: stable-task-id-string
    task_source: non-empty-string
    task_version: positive-integer
    change_version: semver-string
    work_package_id: stable-work-package-id-string
    task_ids: ordered-unique-list-minimum-one
    task_versions: exact-task-id-to-positive-integer-map
    change_versions: exact-task-id-to-semver-map
    estimated_minutes: integer-10-to-360
    primary_owner: non-empty-string
    contract_boundary: non-empty-string
    agent_profile: project-qoder-agent-name
    harness_manifest: repository-relative-hash-bound-json
    allowed_files: non-empty-string
    forbidden_files: non-empty-string
    required_context: non-empty-string
    expected_output: non-empty-string
    acceptance_criteria: non-empty-list-of-strings
    acceptance_evidence: non-empty-list-of-strings
    validation_command: non-empty-string
    failure_policy: non-empty-string
    parent_client: exact-string-codex
change_control:
  dispatched_scope_is_immutable: true
  version_rules:
    patch: "仅澄清说明，验收和 contract 不变。"
    minor: "兼容地增加范围或验收。"
    major: "目标、contract、兼容性或 ownership 边界变化。"
  contract_change_requires:
    - "affected consumer list"
    - "migration tasks"
    - "compatibility window"
    - "rollback strategy"
  rework:
    max_rounds_per_implementer: 2
    preserve_task_id: true
    increment_run_id: true
    increment_task_version_when_scope_changes: true
    after_exhaustion: "拆分 Task、交由 specialist/Main Agent，或向 Gate 返回 BLOCKED。"

risks:
  - id: "RSK-001"
    description: "<失败模式>"
    likelihood: "medium"
    impact: "medium"
    mitigation: "<预防措施>"
    trigger: "<可观察信号>"
    fallback_or_rollback: "<安全动作>"


# 结果报告模板，不是预签发的 PASS；每项以真实执行事实填写。
result_contract:
  status: "<PASS, FAIL, or BLOCKED>"
  allowed_status_values: ["PASS", "FAIL", "BLOCKED"]
  changed_files: []
  validation:
    - command: "<命令>"
      status: "PASS"
      receipt: "<不可变结果路径>"
  acceptance_evidence: []
  effect_checks: []
  risks: []
  callback:
    completion_record_written_first: true
    delivery_status: "<queued, delivered, failed, or unavailable>"
    delivery_is_acceptance: false
  main_agent_review:
    status: "<PASS, FAIL, or BLOCKED>"
    reviewer: "<真实身份>"
    receipt: "<不可变 review 路径>"
