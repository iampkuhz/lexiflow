# 将本条置于 WorkStream/Epic/Capability 的 seed_tasks；替换所有占位符。
# owner 与 phase 继承祖先，仅真实不同的任务事实才显式覆盖。
# ID、分解、依赖、版本、决策、身份与结果规则仅见 harness/agent-policy.md 的工作范围与分解。
id: LF-TSK-<DOMAIN>-NNNN
title: <单一可验证的结果>
priority: P1
task_version: 1
change_version: 1.0.0
task_source: <已批准的 OpenSpec 或任务来源 locator>
estimated_minutes: 45
kind: implementation
lifecycle_state: DRAFT
allowed_files:
- <精确文件或窄范围路径>
forbidden_files:
- secrets/**
- .local/**
- data/**
- .env
expected_output: <可观察结果、明确非目标与需验证的实际假设>
deliverable: <具体产物或行为及定位方式>
acceptance_criteria:
- <单一可观察断言；效果、性能、安全、数据边界写具体事实或引用 OpenSpec>
acceptance_evidence:
- <测试、冻结证据或实际产物 locator；计划状态不是验收>
validation_command: <确定性命令>
required_check_ids:
- <当前 Registry Check ID>
depends_on: []
# 真实依赖在 depends_on 声明 task_id/type/required_task_version/required_change_version。
# hard 另需 required_result；contract 另需 contract_name/required_contract_version/required_result。
# producer 才声明 produced_contracts 的 name/version；真实阶段前置才声明 phase_entry_prerequisite。
# 发现或替代关系按事实填写 discovered_from/supersedes，批准决策通过 task_source 引用。
