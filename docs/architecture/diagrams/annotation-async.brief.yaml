diagram_id: annotation-async
diagram_type: sequence
title: 已提交的语义工作如何形成可显示提示
summary: 已提交的语义工作如何形成可显示提示，仅表达第一阶段的架构责任与保证，不代表产品实现已交付。
numbering_scheme: process_s
participants:
- id: ext
  name: Extension
  type: participant
  description: Extension在本流程的公开责任
- id: workflow
  name: Workflow
  type: participant
  description: Workflow在本流程的公开责任
- id: worker
  name: worker
  type: participant
  description: worker在本流程的公开责任
- id: semantic
  name: Semantic port
  type: participant
  description: Semantic port在本流程的公开责任
- id: enrichment
  name: Enrichment
  type: participant
  description: Enrichment在本流程的公开责任
- id: delivery
  name: Delivery
  type: participant
  description: Delivery在本流程的公开责任
messages:
- id: S1
  from: ext
  to: ext
  description: 立即显示英文
  type: sync
- id: S2
  from: ext
  to: workflow
  description: 请求当前片段提示
  type: sync
- id: S3
  from: workflow
  to: workflow
  description: 确认 durable work 已提交
  type: sync
- id: S4
  from: workflow
  to: ext
  description: 返回 fast result 与 pending
  type: return
- id: S5
  from: worker
  to: workflow
  description: 取得当前 attempt 资格
  type: sync
- id: S6
  from: worker
  to: semantic
  description: 请求有界语境证据
  type: sync
- id: S7
  from: semantic
  to: worker
  description: 返回标准 outcome
  type: return
- id: S8
  from: worker
  to: enrichment
  description: 重验规则并提交合法结果
  type: sync
- id: S9
  from: enrichment
  to: enrichment
  description: 持久保存 result revision
  type: sync
- id: S10
  from: delivery
  to: enrichment
  description: 通过公开合同读取结果
  type: sync
- id: S11
  from: enrichment
  to: delivery
  description: 返回 durable result
  type: return
- id: S12
  from: delivery
  to: ext
  description: 增量投递同一 revision
  type: sync
- id: S13
  from: ext
  to: ext
  description: 检查 caption 与 profile 版本
  type: sync
- id: S14
  from: ext
  to: delivery
  description: 确认收到当前 revision
  type: return
- id: S15
  from: ext
  to: ext
  description: 显示后创建 HintDisplayed
  type: sync
layout:
  direction: top_to_bottom
  include_legend: false
groups:
- id: client
  name: 客户端
  participants:
  - ext
- id: server
  name: 服务端公开协作
  participants:
  - workflow
  - worker
  - semantic
  - enrichment
  - delivery
out_of_scope:
- 存储实现、传输协议与具体超时数值
