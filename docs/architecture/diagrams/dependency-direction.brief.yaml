diagram_id: dependency-direction
diagram_type: architecture
title: 代码依赖朝领域与公开端口收敛
summary: 代码依赖朝领域与公开端口收敛，仅表达第一阶段的架构责任与保证，不代表产品实现已交付。
layers:
- id: roots
  name: 组合根
  description: 组合根的架构职责
  color: '#DBEAFE'
- id: application
  name: 应用用例
  description: 应用用例的架构职责
  color: '#DCFCE7'
- id: domain
  name: 领域判断
  description: 领域判断的架构职责
  color: '#E0E7FF'
- id: ports
  name: 公开端口
  description: 公开端口的架构职责
  color: '#F3E8FF'
- id: adapters
  name: 具体适配器
  description: 具体适配器的架构职责
  color: '#FEF3C7'
components:
- id: api
  name: api root
  layer: roots
  type: component
  description: api root的公开架构边界
- id: worker
  name: worker root
  layer: roots
  type: component
  description: worker root的公开架构边界
- id: workflow
  name: Workflow Application
  layer: application
  type: component
  description: Workflow Application的公开架构边界
- id: enrichment
  name: Enrichment
  layer: domain
  type: component
  description: Enrichment的公开架构边界
- id: learning
  name: Learning
  layer: domain
  type: component
  description: Learning的公开架构边界
- id: semantic
  name: Semantic
  layer: domain
  type: component
  description: Semantic的公开架构边界
- id: contracts
  name: Domain public ports
  layer: ports
  type: interface
  description: Domain public ports的公开架构边界
- id: platform
  name: Platform adapters
  layer: adapters
  type: component
  description: Platform adapters的公开架构边界
flows:
- id: S1
  from: api
  to: workflow
  description: 调用用例
- id: S2
  from: worker
  to: workflow
  description: 调用后台用例
- id: S3
  from: workflow
  to: enrichment
  description: 协调提示
- id: S4
  from: workflow
  to: learning
  description: 接收行为
- id: S5
  from: enrichment
  to: semantic
  description: 请求语义证据
- id: S6
  from: enrichment
  to: contracts
  description: 读取公开事实
- id: S7
  from: learning
  to: contracts
  description: 应用公开 evidence
- id: S8
  from: platform
  to: contracts
  description: 实现端口
- id: S9
  from: api
  to: platform
  description: 显式装配
- id: S10
  from: worker
  to: platform
  description: 显式装配
layout:
  direction: top_to_bottom
  include_legend: true
out_of_scope:
- 具体数据表、HTTP 路径、Prompt 和部署编排
