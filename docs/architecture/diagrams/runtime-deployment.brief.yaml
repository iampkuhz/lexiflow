diagram_id: runtime-deployment
diagram_type: deployment
title: 同一应用的两个进程与外部依赖
summary: 同一应用的两个进程与外部依赖，仅表达第一阶段的架构责任与保证，不代表产品实现已交付。
zones:
- id: client_zone
  name: 用户设备
  type: physical
  description: 浏览器所在设备
- id: server_zone
  name: LexiFlow 服务区
  type: network
  description: 共享代码与事实存储
- id: provider_zone
  name: 外部能力区
  type: security
  description: 不可信 Provider 输出边界
nodes:
- id: extension
  name: Chrome Extension
  zone: client_zone
  type: endpoint
  mode: online
  network_id: client_net
  chain_id: no_chain
  description: Chrome Extension的运行责任
- id: api
  name: api process
  zone: server_zone
  type: system
  mode: online
  network_id: backend_net
  chain_id: no_chain
  description: api process的运行责任
- id: worker
  name: worker process
  zone: server_zone
  type: system
  mode: online
  network_id: backend_net
  chain_id: no_chain
  description: worker process的运行责任
- id: postgres
  name: PostgreSQL
  zone: server_zone
  type: database
  mode: online
  network_id: backend_net
  chain_id: no_chain
  description: PostgreSQL的运行责任
- id: redis
  name: Redis cache
  zone: server_zone
  type: database
  mode: online
  network_id: backend_net
  chain_id: no_chain
  description: Redis cache的运行责任
- id: provider
  name: Model Provider
  zone: provider_zone
  type: endpoint
  mode: online
  network_id: provider_net
  chain_id: no_chain
  description: Model Provider的运行责任
connections:
- id: E1
  from: extension
  to: api
  description: 浏览器发起服务请求
- id: E2
  from: api
  to: postgres
  description: 提交 durable facts/work
- id: E3
  from: worker
  to: postgres
  description: 获取工作并提交结果
- id: E4
  from: api
  to: redis
  description: 读取可重建热点副本
- id: E5
  from: worker
  to: provider
  description: 发起有界模型请求
boundary_triggers:
  cross_network: true
  cross_chain: false
  online_offline: false
  hsm: false
  manual_transfer: false
  manual_handoff: false
layout:
  direction: top_to_bottom
  include_legend: true
out_of_scope:
- 实例数、Compose、云资源、离线补传实现
