# 本机开发资源：会保留开发数据，不可直接当作破坏性测试数据库。
# 隔离测试资源的显式准备见 docs/scenarios/verification-environment.md。
name: lexiflow-local
services:
  redis:
    image: docker.io/library/redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
