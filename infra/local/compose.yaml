# 仅用于独立验证引擎，不在日常 Podman 引擎启用。
# 隔离资源入口见 docs/scenarios/verification-environment.md。
name: lexiflow-local
services:
  redis:
    profiles: [isolated-verification]
    image: docker.io/library/redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
