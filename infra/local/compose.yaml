# 本机开发资源：会保留开发数据，不可直接当作破坏性测试数据库。
# 隔离测试资源的显式准备见 docs/development/operations/verification-environment.md。
name: lexiflow-local
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: lexiflow
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lexiflow"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    volumes:
      - lexiflow-postgres-data:/var/lib/postgresql/data
  redis:
    image: docker.io/library/redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
volumes:
  lexiflow-postgres-data:
