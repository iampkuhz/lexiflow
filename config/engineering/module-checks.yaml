checks:
- check_id: eng.release.version
  command: ["node", "ops/release/test_tools/run-release-tool-tests.mjs"]
  required_environment:
  - git
  input_paths:
  - LICENSE
  - ops/release
  - backend/build.gradle.kts
  - backend/gradle
  transaction_reuse: true
  scenarios: [repository-baseline, change-targeted]
- check_id: eng.repository.docs
  command: ["python3", "-m", "scripts.checks.repository.run_repository_check_group", "--mode", "docs"]
  required_environment:
  - python-package-yaml
  input_paths:
  - scripts/checks/repository
  - docs
  - assets/readme
  - openspec
  - AGENTS.md
  - README.md
  - scripts/agents/__init__.py
  - scripts/agents/work_packages/work_package_contract_checks.py
  - harness
  transaction_reuse: true
  scenarios: [repository-baseline, change-targeted]
- check_id: eng.repository.planning
  command: ["python3", "-m", "scripts.checks.repository.run_repository_check_group", "--mode", "planning"]
  required_environment:
  - python-package-yaml
  input_paths:
  - scripts/checks/repository
  - planning
  - scripts/agents/__init__.py
  - scripts/agents/work_packages/work_package_contract_checks.py
  transaction_reuse: true
  scenarios: [repository-baseline, change-targeted]
- check_id: eng.repository.python-quality
  command: ["python3", "-m", "scripts.checks.repository.run_repository_check_group", "--mode", "python"]
  input_paths:
  - scripts
  - config/engineering/python-quality.toml
  - requirements-dev.txt
  - ops/release
  - ops/dataset
  scenarios: [repository-baseline, change-targeted]
- check_id: eng.backend.delivery
  command: ["python3", "-m", "scripts.local.run_with_java_toolchain", "backend/gradlew", "-p", "backend", "deliveryFull", "--console=colored", "--rerun-tasks", "--no-build-cache"]
  timeout_seconds: 600
  required_environment:
  - java-25-temurin
  - node
  - git
  - postgres-test-jdbc-url
  - redis-test-endpoint
  input_paths:
  - backend/gradlew
  - backend/gradle
  - backend/build.gradle.kts
  - ops/release
  - backend/settings.gradle.kts
  - backend/gradle.properties
  - backend/gradle.lockfile
  - backend/settings-gradle.lockfile
  - backend/verification/quality-gates
  - backend/product/api
  - backend/product/enrichment
  - backend/product/lexicon
  - backend/product/adapters
  - backend/verification/architecture
  - backend/verification/integration
  - infra/postgres/schema.sql
  - scripts/environment
  - ops/dataset
  - ops/podman
  - scripts/local/run_with_java_toolchain.py
  result_contract: gradle-exit-code
  scenarios: [repository-baseline, change-targeted]
  triggers:
  - path: backend
  - path: ops/release
  - path: infra/postgres
  - path: infra/local
  - path: scripts/environment
  - path: ops/dataset
  - path: ops/podman
  - path: scripts/local/run_with_java_toolchain.py
- check_id: eng.backend.build-contract
