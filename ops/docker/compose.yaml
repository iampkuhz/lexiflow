services:
  api:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_API_IMAGE:?LEXIFLOW_API_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - lexiflow-data:/var/lib/lexiflow
    networks: [private]
    tmpfs:
      - /run/lexiflow:mode=0700,uid=10001,gid=10001
      - /tmp:mode=0700,uid=10001,gid=10001,size=128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1280m
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, /app/runtime-entrypoint.sh, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  lexiflow-data:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}

networks:
  private:
    internal: true
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
