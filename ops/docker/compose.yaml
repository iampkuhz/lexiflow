services:
  postgres:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_POSTGRES_IMAGE:?LEXIFLOW_POSTGRES_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    environment:
      POSTGRES_DB: lexiflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, app-password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U lexiflow -d lexiflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  initialize:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_API_IMAGE:?LEXIFLOW_API_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    command: [initialize]
    environment:
      LEXIFLOW_DATASET_SHA256: ${LEXIFLOW_DATASET_SHA256:?LEXIFLOW_DATASET_SHA256 is required}
    secrets: [app-password]
    volumes:
      - ${LEXIFLOW_DATASET_FILE:?LEXIFLOW_DATASET_FILE is required}:/dataset/dataset.zip:ro
      - initialization-work:/work
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    mem_limit: 1280m

  api:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_API_IMAGE:?LEXIFLOW_API_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    command: [api]
    ports: ["127.0.0.1:18080:8080"]
    secrets: [app-password]
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    mem_limit: 1280m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /app/entrypoint.sh, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  postgres-password:
    environment: LEXIFLOW_COMPOSE_POSTGRES_PASSWORD
  app-password:
    environment: LEXIFLOW_COMPOSE_APP_PASSWORD

volumes:
  pgdata:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
  initialization-work:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}

networks:
  private:
    internal: true
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
