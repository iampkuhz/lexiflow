services:
  api:
    labels:
      lexiflow.slot: source
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_API_IMAGE:?LEXIFLOW_API_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    command: [api]
    logging:
      driver: k8s-file
      options:
        max-size: 10mb
    ports: ["127.0.0.1:18081:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/var/lib/lexiflow/lexicon.db?mode=ro
    volumes:
      - ${LEXIFLOW_DATABASE_FILE:?LEXIFLOW_DATABASE_FILE is required}:/var/lib/lexiflow/lexicon.db:ro
    networks: [published]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    mem_limit: 1280m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /app/run-container-command.sh, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  published:
    driver: bridge
    labels:
      lexiflow.slot: source
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
