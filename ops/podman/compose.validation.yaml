services:
  postgres:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_POSTGRES_IMAGE:?LEXIFLOW_POSTGRES_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    environment:
      POSTGRES_DB: lexiflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, app-password]
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private, published]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U lexiflow -d lexiflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
    image: ${LEXIFLOW_API_IMAGE:?LEXIFLOW_API_IMAGE is required}
    pull_policy: never
    platform: ${LEXIFLOW_PLATFORM:?LEXIFLOW_PLATFORM is required}
    command: [api]
    logging:
      driver: k8s-file
      options:
        max-size: 10mb
    ports: ["127.0.0.1:18080:8080"]
    secrets: [app-password]
    networks: [private, published]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m]
    mem_limit: 1280m
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /app/entrypoint.sh, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  postgres-password:
    file: ./secrets/postgres-password
  app-password:
    file: ./secrets/app-password

volumes:
  pgdata:
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
networks:
  private:
    internal: true
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
  published:
    driver: bridge
    labels:
      lexiflow.installation: ${LEXIFLOW_INSTALLATION_ID:?LEXIFLOW_INSTALLATION_ID is required}
      lexiflow.release: ${LEXIFLOW_RELEASE_KEY:?LEXIFLOW_RELEASE_KEY is required}
