# API Composition Root 的运行配置；环境变量覆盖值，默认值不包含真实密钥。
# 启动与端口选择见 docs/development/operations/local-experience.md。
spring:
  application:
    name: lexiflow-api
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  threads:
    virtual:
      enabled: true
lexiflow:
  segment-analysis:
    enabled: false
logging:
  level:
    com.zaxxer.hikari: OFF
management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,customLexicon
          show-details: always
