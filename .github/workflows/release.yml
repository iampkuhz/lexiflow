name: 发行候选与正式发布
run-name: ${{ github.event_name == 'push' && '私有候选构建' || '正式发行晋升' }} · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      submission_id:
        description: 原生正式验收提交 UUID
        required: true
        type: string
      release_tag:
        description: 已准备的发行标签
        required: true
        type: string
      publish_confirmation:
        description: 明确输入 PUBLISH
        required: true
        type: string
      confirmed_recovery:
        description: 仅在已核实远端精确镜像与事务现场后勾选；不跳过候选校验或审批
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 专用 Mac 仅有一台；标签准备和经人工批准的晋升不得并发运行，即使针对不同标签也不例外。
concurrency:
  group: lexiflow-release-host
  cancel-in-progress: false

jobs:
  source:
    name: 验证正式发行标签来源
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_confirmation == 'PUBLISH' && inputs.release_tag == github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 验证精确的发行标签来源
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          node ops/release/integrity/source-build-identity.mjs --tag "$RELEASE_TAG"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 确认专用运行器已就绪
        env:
          RUNNER_READY: ${{ vars.LEXIFLOW_RELEASE_RUNNER_READY }}
        run: |
          test "$RUNNER_READY" = true

  prepare:
    name: 构建私有 ARM64 候选
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: source
    runs-on: [self-hosted, macOS, ARM64, lexiflow-release]
    environment: lexiflow-release-private
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
      LEXIFLOW_JAVA_HOME: ${{ vars.LEXIFLOW_RELEASE_JAVA_HOME }}
      LEXIFLOW_POSTGRES_TEST_JDBC_URL: ${{ secrets.LEXIFLOW_RELEASE_TEST_JDBC_URL }}
      LEXIFLOW_REDIS_TEST_ENDPOINT: ${{ vars.LEXIFLOW_RELEASE_TEST_REDIS_ENDPOINT }}
      LEXIFLOW_RELEASE_ARM64_DOCKER_HOST: ${{ vars.LEXIFLOW_RELEASE_ARM64_DOCKER_HOST }}
      LEXIFLOW_RELEASE_GRADLE_CACHE: ${{ vars.LEXIFLOW_RELEASE_GRADLE_CACHE }}
      LEXIFLOW_RELEASE_NPM_CACHE: ${{ vars.LEXIFLOW_RELEASE_NPM_CACHE }}
    steps:
      # 已配置的固定 checkout 是唯一来源与证据根；不得在含回执的工作区中执行 checkout 或清理。
      - name: 拒绝不安全或已变更的固定源码目录
        env:
          WORKSPACE: ${{ vars.LEXIFLOW_RELEASE_WORKSPACE }}
          LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$WORKSPACE"
          test -d "$WORKSPACE/.git"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git -C "$WORKSPACE" rev-parse --show-toplevel)" = "$WORKSPACE"
          test "$(git -C "$WORKSPACE" rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git -C "$WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          VERSION="$(cat "$WORKSPACE/ops/release/version.txt")"
          test "$RELEASE_TAG" = "v$VERSION"
          test ! -e "$WORKSPACE/tmp/quality/release-workflow/$VERSION"
          cd "$WORKSPACE"
          test -x "$LEXIFLOW_RELEASE_NODE_BIN/node"
          "$LEXIFLOW_RELEASE_NODE_BIN/node" ops/release/integrity/source-build-identity.mjs --tag "$RELEASE_TAG"
          podman info >/dev/null
          podman compose version
      - name: 构建并验证完整的 ARM64 发行候选
        env:
          WORKSPACE: ${{ vars.LEXIFLOW_RELEASE_WORKSPACE }}
          REQUEST_FILE: ${{ vars.LEXIFLOW_RELEASE_REQUEST_FILE }}
          LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
        run: |
          test -n "$REQUEST_FILE"
          test -x "$WORKSPACE/.local/lexiflow-python/bin/python3"
          export PATH="$WORKSPACE/.local/lexiflow-python/bin:$LEXIFLOW_RELEASE_NODE_BIN:$PATH"
          cd "$WORKSPACE"
          test -x "$LEXIFLOW_RELEASE_NODE_BIN/node"
          "$LEXIFLOW_RELEASE_NODE_BIN/node" ops/release/workflow/run-release-workflow.mjs prepare "$REQUEST_FILE"
      # 准备阶段仅留下私有交接，不构成验证证据。完整仓库基线由独立原生验证器负责；Actions 不得预先对同一候选运行完整套件。

  promotion-precheck:
    name: 复核独立验收证据
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_confirmation == 'PUBLISH' && inputs.release_tag == github.ref_name
    needs: source
    runs-on: [self-hosted, macOS, ARM64, lexiflow-release]
    environment: lexiflow-release-private
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
      LEXIFLOW_JAVA_HOME: ${{ vars.LEXIFLOW_RELEASE_JAVA_HOME }}
      LEXIFLOW_POSTGRES_TEST_JDBC_URL: ${{ secrets.LEXIFLOW_RELEASE_TEST_JDBC_URL }}
      LEXIFLOW_REDIS_TEST_ENDPOINT: ${{ vars.LEXIFLOW_RELEASE_TEST_REDIS_ENDPOINT }}
      LEXIFLOW_RELEASE_ARM64_DOCKER_HOST: ${{ vars.LEXIFLOW_RELEASE_ARM64_DOCKER_HOST }}
      LEXIFLOW_RELEASE_GRADLE_CACHE: ${{ vars.LEXIFLOW_RELEASE_GRADLE_CACHE }}
      LEXIFLOW_RELEASE_NPM_CACHE: ${{ vars.LEXIFLOW_RELEASE_NPM_CACHE }}
    steps:
      - name: 在原始固定源码目录中重新消费不可变原生证据
        env:
          WORKSPACE: ${{ vars.LEXIFLOW_RELEASE_WORKSPACE }}
          LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$WORKSPACE"
          test -n "$EXPECTED_COMMIT"
          test -d "$WORKSPACE/.git"
          test -x "$WORKSPACE/.local/lexiflow-python/bin/python3"
          test "$(git -C "$WORKSPACE" rev-parse HEAD)" = "$EXPECTED_COMMIT"
          export PATH="$WORKSPACE/.local/lexiflow-python/bin:$LEXIFLOW_RELEASE_NODE_BIN:$PATH"
          cd "$WORKSPACE"
          test -x "$LEXIFLOW_RELEASE_NODE_BIN/node"
          "$LEXIFLOW_RELEASE_NODE_BIN/node" ops/release/workflow/run-release-workflow.mjs resume "$SUBMISSION_ID" "$RELEASE_TAG"

  promotion:
    name: 发布已批准的正式发行
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_confirmation == 'PUBLISH' && inputs.release_tag == github.ref_name
    needs: [source, promotion-precheck]
    runs-on: [self-hosted, macOS, ARM64, lexiflow-release]
    environment: lexiflow-release-promotion
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
      LEXIFLOW_JAVA_HOME: ${{ vars.LEXIFLOW_RELEASE_JAVA_HOME }}
      LEXIFLOW_POSTGRES_TEST_JDBC_URL: ${{ secrets.LEXIFLOW_RELEASE_TEST_JDBC_URL }}
      LEXIFLOW_REDIS_TEST_ENDPOINT: ${{ vars.LEXIFLOW_RELEASE_TEST_REDIS_ENDPOINT }}
      LEXIFLOW_RELEASE_ARM64_DOCKER_HOST: ${{ vars.LEXIFLOW_RELEASE_ARM64_DOCKER_HOST }}
      LEXIFLOW_RELEASE_GRADLE_CACHE: ${{ vars.LEXIFLOW_RELEASE_GRADLE_CACHE }}
      LEXIFLOW_RELEASE_NPM_CACHE: ${{ vars.LEXIFLOW_RELEASE_NPM_CACHE }}
    steps:
      - name: 仅在受保护审批及最新原生证据检查后发布
        env:
          WORKSPACE: ${{ vars.LEXIFLOW_RELEASE_WORKSPACE }}
          LEXIFLOW_RELEASE_NODE_BIN: ${{ vars.LEXIFLOW_RELEASE_NODE_BIN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMED_RECOVERY: ${{ inputs.confirmed_recovery }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEXIFLOW_RELEASE_CONFIG_TOKEN: ${{ secrets.LEXIFLOW_RELEASE_CONFIG_TOKEN }}
        run: |
          test -n "$WORKSPACE"
          test -d "$WORKSPACE/.git"
          test -x "$WORKSPACE/.local/lexiflow-python/bin/python3"
          export PATH="$WORKSPACE/.local/lexiflow-python/bin:$LEXIFLOW_RELEASE_NODE_BIN:$PATH"
          cd "$WORKSPACE"
          test -x "$LEXIFLOW_RELEASE_NODE_BIN/node"
          if [ "$CONFIRMED_RECOVERY" = "true" ]; then
            "$LEXIFLOW_RELEASE_NODE_BIN/node" ops/release/workflow/run-release-workflow.mjs resume "$SUBMISSION_ID" "$RELEASE_TAG" --publish --confirmed-recovery
          else
            "$LEXIFLOW_RELEASE_NODE_BIN/node" ops/release/workflow/run-release-workflow.mjs resume "$SUBMISSION_ID" "$RELEASE_TAG" --publish
          fi
