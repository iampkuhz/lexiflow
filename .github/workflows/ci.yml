name: 工程快速检查
run-name: 工程快速检查 · ${{ github.ref_name }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: 快速检查与扩展程序归档验证
    # 无发布凭据的临时托管宿主；不代表产品支持 Linux 或完成 Mac/Podman 验收。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports: ['127.0.0.1:6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEXIFLOW_REDIS_TEST_ENDPOINT: 127.0.0.1:6379
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 配置 Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: 准备隔离检查依赖
        run: |
          python -m pip install -r requirements-dev.txt
          npm --prefix extension ci
          cd extension
          npx --no-install playwright install --with-deps chromium
      - name: 运行共享快速检查配置
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:contracts/versions.lock.json" 2>/dev/null; then
            # 先完成固定 Wrapper 的下载，避免首次下载日志混入 SQLite 合同 JSON。
            backend/gradlew --version
            for scope in extension-api sqlite-storage; do
              node scripts/contracts/version-contract.mjs check --scope "$scope" --base "$BASE_SHA"
            done
          elif [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:scripts/contracts/version-contract.mjs" 2>/dev/null; then
            echo '已有接口工具的基线不允许缺少版本锁' >&2
            exit 1
          fi
          if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            xvfb-run -a python -m scripts.triggers.run_ci_quick_checks quick --all
          else
            xvfb-run -a python -m scripts.triggers.run_ci_quick_checks quick --base "$BASE_SHA"
          fi
      - name: 构建并冒烟验证扩展程序归档
        id: package
        run: |
          node extension/scripts/packaging/package-extension-release.mjs --development > "$RUNNER_TEMP/extension-package.json"
          ZIP=$(node -e 'const d=require(process.argv[1]); console.log(`tmp/ci-preview/${d.softwareVersion}/${d.sourceCommit}/${d.filename}`)' "$RUNNER_TEMP/extension-package.json")
          node extension/scripts/checks/check-extension-archive.mjs --development "$ZIP" "$GITHUB_SHA"
          xvfb-run -a node extension/tests/archive-smoke.mjs --development "$ZIP" "$GITHUB_SHA"
          printf 'zip=%s\n' "$ZIP" >> "$GITHUB_OUTPUT"
      - name: 上传已验证的扩展程序 ZIP 与校验和
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lexiflow-chrome-extension-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
      # 仅上传固定 ZIP 和 checksum；不上传整个 tmp/ 或运行日志。
