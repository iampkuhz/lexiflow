name: Quick checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    # 无发布凭据的临时托管宿主；不代表产品支持 Linux 或完成 Mac/Podman 验收。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lexiflow_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lexiflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['127.0.0.1:6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEXIFLOW_POSTGRES_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/lexiflow_test?user=postgres
      LEXIFLOW_REDIS_TEST_ENDPOINT: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare isolated check dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm --prefix extension ci
          cd extension
          npx --no-install playwright install --with-deps chromium
      - name: Run shared quick profile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            xvfb-run -a python -m scripts.verification.ci quick --all
          else
            xvfb-run -a python -m scripts.verification.ci quick --base "$BASE_SHA"
          fi
      - name: Build and smoke check extension archive
        id: package
        run: |
          node extension/scripts/release.mjs > "$RUNNER_TEMP/extension-package.json"
          ZIP=$(node -e 'const d=require(process.argv[1]); console.log(`tmp/releases/${d.softwareVersion}/${d.sourceCommit}/${d.filename}`)' "$RUNNER_TEMP/extension-package.json")
          node extension/scripts/archive-check.mjs "$ZIP" "$GITHUB_SHA"
          xvfb-run -a node extension/tests/archive-smoke.mjs "$ZIP" "$GITHUB_SHA"
          printf 'zip=%s\n' "$ZIP" >> "$GITHUB_OUTPUT"
      - name: Upload verified extension ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lexiflow-chrome-extension-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
      # 仅上传固定 ZIP 和 checksum；不上传整个 tmp/ 或运行日志。
