schema_version: lexiflow.module-checks.v1
description: Closed module-owned checks. Every engineering module exposes a structured completeness result; zero tests, skips,
  missing results, and unexecuted checks cannot PASS. Product delivery remains native Gradle/npm.
checks:
- check_id: eng.verification.module-tests
  module: verification
  command:
  - python3
  - tests/verification/module_check_adapter.py
  - --root
  - .
  - --mode
  - verification-tests
  executable: python3
  cwd: .
  timeout_seconds: 180
  scope: repository-baseline
  triggers:
  - path: scripts/verification/
  - path: scripts/environment/
  - path: tests/verification/
  - path: scripts/check_changes.py
  - path: scripts/check_repository.py
  - path: tests/__init__.py
  - path: requirements-dev.txt
  - path: harness/module-checks.yaml
  module_dependencies: []
  required_environment:
  - python3
  input_paths:
  - scripts/verification
  - scripts/environment
  - scripts/check_changes.py
  - scripts/check_repository.py
  - tests/verification
  - tests/__init__.py
  - requirements-dev.txt
  result_contract:
    type: json-stdout
    required_fields:
    - status
    - checks_run
    - failures
    - errors
    - skipped
    - reason
    allowed_statuses:
    - PASS
    - BLOCKED
    - FAIL
    minimum:
      checks_run: 1
    equals:
      failures: 0
      errors: 0
      skipped: 0
- check_id: eng.verification.module-tests-on-change
  module: verification-change
  command:
  - python3
  - tests/verification/module_check_adapter.py
  - --root
  - .
  - --mode
