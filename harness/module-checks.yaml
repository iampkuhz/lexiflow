# Quality Gate 的声明表，不是按文件排列的执行顺序。
# 先读 docs/development/change-delivery/verification.md 理解选择、冻结与执行。
# 每项按入口 → scope/触发 → 依赖 → 环境 → 输入 → result contract 阅读。
# baseline 与 on-change 是两种选择视图；同轮执行去重由 Verification 负责。
schema_version: lexiflow.module-checks.v1
description: "各工程模块拥有自己的 Check，并返回结构化完整性结果；零测试、跳过、缺失结果或未执行均不能 PASS。产品交付仍由原生 Gradle/npm 执行。"
checks:

# Verification 自测：选择、冻结、执行和报告的内部合同。
- check_id: eng.verification.module-tests
  module: verification
  command:
  - python3
  - tests/verification/module_check_adapter.py
  executable: python3
  cwd: .
  timeout_seconds: 180
  scope: repository-baseline
  triggers:
  - path: scripts/verification/
  - path: scripts/environment/
  - path: tests/verification/
  - path: scripts/check_changes.py
  - path: scripts/check_repository.py
  - path: tests/__init__.py
  - path: requirements-dev.txt
  - path: harness/module-checks.yaml
  module_dependencies: []
  required_environment:
  - python3
  input_paths:
  - scripts/verification
  - scripts/environment
  - scripts/check_changes.py
  - scripts/check_repository.py
  - tests/verification
  - tests/__init__.py
  - requirements-dev.txt
  - harness/delivery-hooks.json
  - harness/test-services.json
  - .codex/hooks.json
  - .qoder/settings.json
  result_contract:
    type: json-stdout
    required_fields:
    - status
    - checks_run
    - failures
    - errors
    - skipped
    - reason
    allowed_statuses:
    - PASS
    - BLOCKED
    - FAIL
    minimum:
      checks_run: 1
    equals:
      failures: 0
      errors: 0
      skipped: 0
- check_id: eng.verification.module-tests-on-change
  module: verification-change
  command:
  - python3
  - tests/verification/module_check_adapter.py
  executable: python3
  cwd: .
  timeout_seconds: 180
  scope: change-targeted
  triggers:
  - path: scripts/verification/
  - path: scripts/environment/
  - path: tests/verification/
  - path: scripts/check_changes.py
  - path: scripts/check_repository.py
  - path: tests/__init__.py
  - path: requirements-dev.txt
  - path: harness/module-checks.yaml
  module_dependencies: []
  required_environment:
  - python3
  input_paths:
  - scripts/verification
  - scripts/environment
  - scripts/check_changes.py
  - scripts/check_repository.py
  - tests/verification
  - tests/__init__.py
  - requirements-dev.txt
  - harness/delivery-hooks.json
  - harness/test-services.json
  - .codex/hooks.json
  - .qoder/settings.json
  result_contract:
    type: json-stdout
    required_fields:
    - status
    - checks_run
    - failures
    - errors
    - skipped
    - reason
    allowed_statuses:
    - PASS
    - BLOCKED
    - FAIL
    minimum:
      checks_run: 1
    equals:
      failures: 0
      errors: 0
      skipped: 0

