  - backend/apps/worker/src
  - backend/apps/worker/gradle.lockfile
  - backend/application/lexicon/src
  - backend/application/lexicon/gradle.lockfile
  - backend/application/workflow/src
  - backend/application/workflow/gradle.lockfile
  - backend/modules/enrichment/src
  - backend/modules/enrichment/gradle.lockfile
  - backend/modules/lexicon/src
  - backend/modules/lexicon/gradle.lockfile
  - backend/platform/adapters/src
