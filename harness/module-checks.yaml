schema_version: lexiflow.module-checks.v2
description: 各工程模块拥有自己的 Check，并返回结构化完整性结果；零测试、跳过、缺失结果或未执行均不能 PASS。产品交付仍由原生 Gradle/npm 执行。
executions:
  exec-eng-release-version:
    command:
    - node
    - ops/release/check.mjs
    timeout_seconds: 180
    required_environment:
    - node
    - git
    input_paths:
    - ops/release/version.txt
    - ops/release/version.mjs
    - ops/release/check.mjs
    - ops/release/tests/version.test.mjs
    - backend/build.gradle.kts
    - backend/gradle/build-logic/src/main/kotlin/io/lexiflow/buildlogic/ReleaseVersion.kt
    - backend/gradle/build-logic/src/test/kotlin/io/lexiflow/buildlogic/ReleaseVersionTest.kt
    transaction_reuse: true
  exec-eng-repository-docs:
    command:
    - python3
    - -m
    - scripts.repository.quality
    - --mode
    - docs
    timeout_seconds: 180
    required_environment:
    - python3
    - python-package-yaml
    input_paths:
    - scripts/repository
    - docs
    - assets/readme
    - openspec
    - AGENTS.md
    - README.md
    - harness/README.md
    - harness/documentation-policy.yaml
    transaction_reuse: true
  exec-eng-repository-policy:
    command:
    - python3
    - -m
    - scripts.repository.quality
    - --mode
    - policy
    timeout_seconds: 180
    required_environment:
    - python3
    - python-package-yaml
    input_paths:
    - scripts/repository
    - harness/agent-policy.manifest.yaml
    - harness/agent-runtime.manifest.yaml
    - planning/task-template.yaml
    - planning/workstreams.yaml
    transaction_reuse: true
  exec-eng-repository-planning:
    command:
    - python3
    - -m
    - scripts.repository.quality
    - --mode
    - planning
    timeout_seconds: 180
    required_environment:
    - python3
    - python-package-yaml
    input_paths:
    - scripts/repository
    - planning
    - harness
    - scripts/repository/planning_check.py
    - scripts/repository/planning_validator.py
    - scripts/repository/catalog.py
    - scripts/repository/task_source.py
    transaction_reuse: true
  exec-eng-repository-hooks:
    command:
    - python3
    - -m
    - scripts.repository.quality
    - --mode
    - hooks
    timeout_seconds: 180
    required_environment:
    - python3
    - python-package-yaml
    input_paths:
    - scripts/repository
    - .githooks
    - scripts/repository/hooks.py
    - scripts/verification/delivery_hook.py
    - .codex/hooks.json
    - .qoder/settings.json
    - harness/delivery-hooks.json
    - harness/test-services.json
    transaction_reuse: true
  exec-eng-repository-python-quality:
    command:
    - python3
    - -m
    - scripts.repository.quality
    - --mode
    - python
    timeout_seconds: 180
    required_environment:
    - python3
    input_paths:
    - scripts
    - harness/python-quality.toml
    - harness/python-docstrings.toml
    - requirements-dev.txt
  exec-eng-backend-delivery:
    command:
    - python3
    - -m
    - scripts.environment.java_exec
    - backend/gradlew
    - -p
    - backend
    - deliveryFull
    - --console=colored
    - --rerun-tasks
    - --no-build-cache
    timeout_seconds: 600
    required_environment:
    - java-25-temurin
    - node
    - git
