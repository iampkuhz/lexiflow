schemaVersion: 1
dependency_rules:
- composition roots may depend on application use cases and platform infrastructure
- application use cases may depend on domain contracts
- platform infrastructure may depend on the public contracts needed by its technical integrations
- domain models and policies may depend only on Java standard types and public domain contracts
- no module may access another domain's persistence implementation or tables
- no core module may depend on Chrome, YouTube, HTTP, Redis, PostgreSQL or a concrete model provider
bounded_contexts:
  lexicon:
    display_name: 共享词汇知识
    kind: supporting-domain
    owns:
    - terms
    - phrases
    - senses
    - frequency
    - cefr
    - domain-metadata
    - lexicon-version
    may_depend_on: []
  enrichment:
    display_name: 通用字幕提示
    kind: core-domain
    owns:
    - caption-context
    - candidate-pipeline
    - need-hint-policy
    - published-semantic-material-matching
    - annotation-decision
    - annotation-result
    may_depend_on:
    - lexicon
application_modules:
  workflow-application:
    owns:
    - enrich-caption-use-case
    may_depend_on:
    - lexicon
    - enrichment
  lexicon-application:
    owns:
    - lexicon-import-service
    - version-aware-lexicon-query-service
    - lexicon-repository-contract
    may_depend_on:
    - lexicon
infrastructure_modules:
  platform-adapters:
    owns:
    - postgres-integration
    - redis-integration
    - security-integration
    - offline-model-provider-integration
    - job-runtime-integration
    - observability-integration
    may_depend_on:
    - lexicon
    - enrichment
    - workflow-application
    - lexicon-application
composition_roots:
  api:
    includes:
    - application-use-cases
    - inbound-http
    - platform-infrastructure
  worker:
    includes:
    - background-use-cases
    - job-runtime-trigger
    - platform-infrastructure
client_adapters:
  chrome-extension:
    source_of_truth: false
    first_content_source: youtube
    owns:
    - local-suppressed-term-preference
    constraints:
    - explicit-user-action-only
    - local-only-no-upload
    - no-auto-familiarity-inference
    - no-account-or-cross-device-sync
