# Domain ownership 与依赖方向；不是部署拓扑，也不按 api/worker 划分业务服务。
schemaVersion: 1
dependency_rules:
- "Composition Root 可依赖 Application Use Case 与 Platform Infrastructure。"
- "Application Use Case 可依赖 Domain contract。"
- "Platform Infrastructure 可依赖技术集成所需的公开 contract。"
- "Domain 模型与策略仅可依赖 Java 标准类型及公开 Domain contract。"
- "模块不得访问其他 Domain 的持久化实现或数据表。"
- "核心模块不得依赖 Chrome、YouTube、HTTP、Redis、PostgreSQL 或具体 Model Provider。"

# Domain 拥有业务概念；其他模块只能消费其公开 contract。
bounded_contexts:
  lexicon:
    display_name: 共享词汇知识
    kind: supporting-domain
    owns:
    - terms
    - phrases
    - senses
    - frequency
    - cefr
    - domain-metadata
    - lexicon-version
    may_depend_on: []
  enrichment:
    display_name: 通用字幕提示
    kind: core-domain
    owns:
    - caption-context
    - candidate-pipeline
    - need-hint-policy
    - published-semantic-material-matching
    - annotation-decision
    - annotation-result
    may_depend_on:
    - lexicon

# Application 编排用例，不拥有其他 Domain 的存储。
application_modules:
  workflow-application:
    owns:
    - enrich-caption-use-case
    may_depend_on:
    - lexicon
    - enrichment
  lexicon-application:
    owns:
    - lexicon-import-service
    - version-aware-lexicon-query-service
    - lexicon-repository-contract
    may_depend_on:
    - lexicon

# Infrastructure 通过 port 实现技术集成。
infrastructure_modules:
  platform-adapters:
    owns:
    - postgres-integration
    - redis-integration
    - security-integration
    - offline-model-provider-integration
    - job-runtime-integration
    - observability-integration
    may_depend_on:
    - lexicon
    - enrichment
    - workflow-application
    - lexicon-application

# Composition Root 负责组装；api/worker 分进程不改变领域边界。
composition_roots:
  api:
    includes:
    - application-use-cases
    - inbound-http
    - platform-infrastructure
  worker:
    includes:
    - background-use-cases
    - job-runtime-trigger
    - platform-infrastructure

# 客户端保持薄，只保留显式、本机私有的偏好。
client_adapters:
  chrome-extension:
    source_of_truth: false
    first_content_source: youtube
    owns:
    - local-suppressed-term-preference
    constraints:
    - explicit-user-action-only
    - local-only-no-upload
    - no-auto-familiarity-inference
    - no-account-or-cross-device-sync
