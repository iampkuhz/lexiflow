# Domain ownership 与依赖方向；不是部署拓扑，也不按 api/worker 划分业务服务。
schemaVersion: 1
dependency_rules:
- "Composition Root 可依赖 Application Use Case 与 Platform Infrastructure。"
- "Application Use Case 可依赖 Domain contract。"
- "Platform Infrastructure 可依赖技术集成所需的公开 contract。"
- "Domain 模型与策略仅可依赖 Java 标准类型及公开 Domain contract。"
- "模块不得访问其他 Domain 的持久化实现或数据表。"
- "核心模块不得依赖 Chrome、YouTube、HTTP、Redis、PostgreSQL 或具体 Model Provider。"

# Domain 拥有业务概念；其他模块只能消费其公开 contract。
bounded_contexts:
  lexicon:
    display_name: 共享词汇知识
    gradle_project: ":modules:lexicon"
    kind: supporting-domain
    owns:
    - terms
    - phrases
    - senses
    - frequency
    - cefr
    - domain-metadata
    - lexicon-version
    may_depend_on: []
  enrichment:
    display_name: 通用字幕提示
    gradle_project: ":modules:enrichment"
    kind: core-domain
    owns:
    - caption-context
    - candidate-pipeline
    - need-hint-policy
    - published-semantic-material-matching
    - annotation-decision
    - annotation-result
    may_depend_on:
    - lexicon

# Application 是所属领域项目内的逻辑包，不是独立 Gradle 项目。
application_packages:
  enrichment-caption:
    owner: enrichment
    package: io.lexiflow.enrichment.application.caption
    owns:
    - enrich-caption-use-case
    may_depend_on:
    - enrichment-domain
    - lexicon-public-domain-contract
  lexicon-application:
    owner: lexicon
    package: io.lexiflow.lexicon.application
    owns:
    - lexicon-import-service
    - version-aware-lexicon-query-service
    - lexicon-repository-contract
    may_depend_on:
    - lexicon-domain

package_rules:
- "每个领域项目保留 domain 与 application；domain 不得依赖 application。"
- "按业务功能再按职责组织 model、policy、port、importing、query；不按 record 语法分组。"
- "model 不依赖服务、用例、领域策略或端口实现；嵌套辅助类型可留在所属行为类型内。"
- "Enrichment 仅消费 Lexicon domain.model 与 domain.port；禁止访问 application 或内置 catalog 实现。"
- "Lexicon 不反向依赖 Enrichment；基础设施仅依赖实际使用的 Lexicon 模块。"
- "导入 model 可依赖 importing.validation 构造校验；validation 仅依赖 Java 标准库及自身，不依赖其他应用类型。"
- "持久化 DO/DAO/Mapper 保留同包私有封装，不为目录对称扩大可见性。"
- "类名用领域名词或 Service、UseCase、Request、Result、Response 等职责后缀，不统一添加 Record/DTO。"

# Infrastructure 通过 port 实现技术集成。
infrastructure_modules:
  platform-adapters:
    owns:
    - postgres-integration
    - redis-integration
    - security-integration
    - offline-model-provider-integration
    - job-runtime-integration
    - observability-integration
    may_depend_on:
    - lexicon

# Composition Root 负责组装；api/worker 分进程不改变领域边界。
composition_roots:
  api:
    includes:
    - application-use-cases
    - inbound-http
    - platform-infrastructure
  worker:
    direct_product_dependencies: []
    note: 尚无后台业务实现，不预先挂载领域或适配器依赖。
    includes:
    - background-use-cases
    - job-runtime-trigger
    - platform-infrastructure

# 客户端保持薄，只保留显式、本机私有的偏好。
client_adapters:
  chrome-extension:
    source_of_truth: false
    first_content_source: youtube
    owns:
    - local-suppressed-term-preference
    constraints:
    - explicit-user-action-only
    - local-only-no-upload
    - no-auto-familiarity-inference
    - no-account-or-cross-device-sync
