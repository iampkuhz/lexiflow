# 客户端运行边界；共享规则唯一维护于 agent-policy.manifest.yaml。
schemaVersion: 1
protected_roots:
- .codex/
- .qoder/
- harness/
- scripts/
- openspec/
- planning/
- backend/
- extension/**
- AGENTS.md
lifecycle:
  owner: client
  checkout: client-selected
  repository_state_required_for_read_or_write: false
  branch_commit: explicit
  branch_integration: explicit-user-action
  platform_event_bindings: []
  forbidden_git_actions:
  - stash
  - reset
  - force
  - rebase
  - auto-push
validation:
  invocation: explicit
  delivery_command: python3 scripts/check_changes.py
  repository_baseline_command: python3 scripts/check_repository.py
  passing_requires_success: true
  non_passing_results:
  - BLOCKED
  - FAIL
runtime_data:
  committed: false
  paths:
  - tmp/
  - .local/
  - data/
  - secrets/
platforms:
  codex:
    config_files:
    - .codex/config.toml
    agents_dir: .codex/agents
  qoder:
    config_files:
    - .qoder/AGENTS.md
    agents_dir: .qoder/agents
