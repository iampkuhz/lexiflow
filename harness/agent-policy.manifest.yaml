# Agent 策略真源：先读边界，再按 subagent_protocol → agent_dispatch → runner 专属规则下钻。
# 英文短值多为机器协议，不翻译；中文解释与术语表见 docs/development/reference/engineering-glossary.md。
schemaVersion: 1

# 范围护栏：受保护目录仍可按授权编辑，但不能越权、伪造身份或覆盖他人改动。
protected_roots:
- .codex/
- .qoder/
- harness/
- scripts/
- openspec/
- planning/
- backend/
- extension/**
- AGENTS.md

# 规则只在共享入口维护；客户端不复制另一套规范。
context_hygiene:
  shared_rule_locations:
  - AGENTS.md
  - harness/
  platform_configs_are_entry_points: true
  runtime_state_in_harness: false

# 执行与交接：区分计划、已派发、真实启动及正式验收。
execution_progress:
  rule: 用户明确要求启动或继续时，在授权范围内实际执行到派发、同步交付或可核验阻塞；不得仅阅读配置、描述下一步后结束，也不得暗示回合结束后会自动继续。
  dispatch_evidence: start 返回 run_id 仅表示已派发；只有匹配身份的 started.json 才证明 CLI 已启动。预检 PASS、计划和预计动作均不是启动证据。
  blocked_handoff: 报告实际失败层、阻塞证据与可执行接手路径；可自行完成的准备或合规接手应继续执行，只有缺用户决定、外部恢复或真实执行能力时才交还控制权。
  asynchronous_dispatch_handoff: Qoder start/resume 返回 AWAITING_CALLBACK 后必须立即结束当前主线程回合；这是实际派发后的控制权交接，不属于只承诺不执行。不得 sleep、查时钟、探测进程/日志或以其他工作保持本轮活跃等待完成。只由终态 callback 续办；重复已 ack/superseded 回调直接结束。

# 隐私边界：下列数据不得进入共享产物或委派上下文。
privacy:
  forbidden_inputs:
  - secrets
  - tokens
  - real-user-captions
  - viewing-history
  - unredacted-model-payloads
  - runtime-cache
  - personal-config

# Git 集成需用户明示，不把自动提交当作交付步骤。
git_safety:
  forbidden_actions:
  - stash
  - reset
  - force
  - rebase
  - unauthorized-push
  integration_requires_explicit_user_choice: true

# 依赖方向是架构 contract；箭头表示允许依赖，不表示 workflow 顺序。
architecture:
  style: modular-monolith
  dependency_rules:
  - composition-root -> application
  - composition-root -> concrete-inbound-adapters
  - composition-root -> concrete-outbound-adapters
  - inbound-adapters -> application
  - outbound-adapters -> domain-ports
  - application -> domain-and-ports
  forbidden:
  - domain-depends-on-framework
  - domain-depends-on-concrete-adapter
  - application-depends-on-concrete-adapter
  - inbound-adapter-depends-on-outbound-adapter
  - cross-domain-table-access
  - extension-as-service-source-of-truth
  - english-caption-waits-for-model

# 工作包公共 contract：模型选择、身份、caller 输入、runner 输出与结果核对。
subagent_protocol:

  # 按完整工作包分类；角色名和继承设置不能代替显式模型与 reasoning 参数。
  codex_model_policy:
    default_model: gpt-6-luna
    routine_model: gpt-6-luna
    routine_reasoning_effort: low
    applies_to: codex-sub-agent
    explicit_model_argument_required: true
    routine_routing:
      decision_owner: parent-agent
      classification_scope: whole-work-package
      eligible_routine_must_use_routine_model: true
      role_does_not_pin_model: true
      prompt_text_does_not_select_model: true
      required_conditions:
      - frozen-contract-and-acceptance
      - bounded-coherent-work-package
      - deterministic-direct-validation
      eligible_examples:
      - fixture-and-repetitive-test-expansion
      - approved-document-and-example-synchronization
      - frozen-dto-mapping-and-client-type-adaptation
      - presentation-only-extension-components
      - complete-module-slice-with-known-contracts
      - source-bound-review-and-targeted-validation
      frequency_or_agent_name_alone_is_not_eligibility: true
      deterministic_single_command_or_small_fix: main-agent-no-dispatch
      selection_record: existing-parent-dispatch-note-class-model-reason
      luna_blocker_policy: stop-and-compact-callback-parent-checks-failure-layer-before-escalation
      default_dispatch: luna-first
      complex_mixed_or_unclassified: use-default-model-with-default-reasoning
      category_alone_does_not_escalate: true
      escalation_record: existing-parent-dispatch-note-specific-evidence-and-decision
    allowed_escalation_models:
    - gpt-6-sol
    user_only_models:
    - gpt-6-astra
    escalation_requires:
    - stable_task_id
    - parent_decision
    - specific_failure_or_uncovered_risk_evidence
    escalation_reasons:
    - luna_acceptance_blocked
    - specific_uncovered_risk
    - explicit_user_requirement
    qoder_model_policy: separate-runner-controlled
    default_reasoning_effort: medium
  status_values:
  - PASS
  - FAIL
  - BLOCKED
  completion_signal:
    callback_first: true
    max_blocking_findings: 3
    allowed_fields:
    - status
    - work_package_id
    - task_ids
    - run_id
    - artifact_locators
    - validation_commands
    - blocking_findings
    allowed_fields_applies_to: qoder-task-signal
    qoder_task_allowed_fields:
    - status
    - work_package_id
    - task_ids
    - run_id
    - artifact_locators
    - validation_commands
    - blocking_findings
    codex_work_package_allowed_fields:
    - status
    - work_package_id
    - task_ids
    - run_id
    - artifact_locators
    - validation_commands
    - blocking_findings
    full_context_or_logs_in_callback: forbidden
    main_agent_confirmation: verify-canonical-artifact-hashes-and-run-risk-selected-validation
  task_sizing_minutes:
    applies_to: catalog-task-not-agent-session
    min: 20
    max: 90

  # Work Package 是可独立验收的连贯工作，不按一次模型对话随意切片。
  delegation_work_package:
    unit: coherent-set-of-catalog-tasks
    identity_fields:
    - work_package_id
    - task_ids
    work_package_id_rule: caller-stable-non-run-identity
    task_ids_rule: exact-ordered-catalog-task-identities
    per_task_outcome_evidence_required: true
    preferred_minutes:
      min: 10
      max: 360
    minimum_total_estimated_minutes: 10
    target_maximum_total_estimated_minutes: 360
    minimum_catalog_tasks: 1
    must_share:
    - primary_owner
    - contract_boundary
    - compatible_write_scope
    required_outcomes:
    - implementation_or_design
    - direct_validation
    - acceptance_evidence
    proactive_dispatch:
      threshold_minutes: 10
      prefer_when:
      - isolated-subtask-requires-large-new-context
      - acceptance-is-confirmable-by-compact-result-or-deterministic-command
      - non-overlapping-write-scope
    main_agent_only_when:
    - deterministic-task-at-or-under-10-minutes
    - isolated_read_only_review
    turn_or_token_count_is_not_acceptance_evidence: true
  identity_rules:
  - "每次 Qoder handoff 必须有稳定的 work_package_id，以及至少一个按顺序声明的 Task ID。"
  - "每个 Codex Work Package 必须有稳定的 work_package_id，以及精确且有序的 task_ids 列表。"
  - "每次 run 必须具有唯一的 agent_id 与 run_id。"
  - "并行写入者的 ownership 不得重叠。"
  - "Main Agent 独立核验委派产物。"
  skipped_semantics: "skipped、not-run、unavailable、excluded、queued、acknowledged 与 exit-zero 均不等于 PASS。"
  caller_required_input_applies_to: qoder-task-handoff
  caller_required_input:
  - goal
  - task_id
  - task_source
  - task_version
  - change_version
  - work_package_id
  - task_ids
  - task_versions
  - change_versions
  - estimated_minutes
  - primary_owner
  - contract_boundary
  - agent_profile
  - harness_manifest
  - allowed_files
  - forbidden_files
  - required_context
  - expected_output
  - acceptance_criteria
  - acceptance_evidence
  - validation_command
  - failure_policy
  - parent_client
  codex_work_package_caller_required_input:
  - goal
  - work_package_id
  - task_ids
  - task_versions
  - change_versions
  - estimated_minutes
  - primary_owner
  - contract_boundary
  - allowed_files
  - forbidden_files
  - required_context
  - expected_outputs_by_task
  - acceptance_by_task
  - validation_commands
  - failure_policy
  - parent_client
  codex_work_package_runner_identity:
    parent_session_id: runtime-bound-parent-session
    agent_id: codex-runtime-bound-stable-actor
    run_id: subagent-generated-once
    session_id: codex-runtime-bound
    client: exact-string-codex
    parent_client: exact-string-codex
    caller_must_omit:
    - parent_session_id
    - agent_id
    - run_id
    - session_id
    - client
  codex_work_package_result:
    schema_version: lexiflow.codex-work-package-result.v1
    schema_locator: harness/codex-work-package-result.schema.json
    publisher: scripts/agents/codex/work_package.py
    layout: tmp/quality/codex-work-packages/{run_id}/tasks/{task_id}/{task-projection,outcome,completion,signal}.json
    completion_locator: tmp/quality/codex-work-packages/{run_id}/package-completion.json
    task_keyset: exact-task-ids
    aggregation: FAIL-over-BLOCKED-over-PASS
    publication: immutable-completion-before-signal
    legacy_layout_fallback: forbidden
    subprocess_or_log_result_inference: forbidden
    verify_command: python3 -m scripts.agents.delegation.codex_cli verify --run-id <run_id>
  codex_work_package_task_projection:
    schema_version: lexiflow.codex-work-package-task-projection.v1
    unit: one-immutable-raw-task-per-target-catalog-task
    exact_top_level_fields:
    - schema_version
    - work_package_id
    - task_ids
    - target_task_id
    - task_id
    - task_source
    - task_version
    - change_version
    - allowed_files
    - forbidden_files
    - expected_output
    - acceptance_criteria
    - acceptance_evidence
    - validation_command
    - caller_contract
    - parent_session_id
    - agent_id
    - run_id
    - session_id
    - client
    - parent_client
    caller_contract_exact_fields:
    - goal
    - work_package_id
    - task_ids
    - task_versions
    - change_versions
    - estimated_minutes
    - primary_owner
    - contract_boundary
    - allowed_files
    - forbidden_files
    - required_context
    - expected_outputs_by_task
    - acceptance_by_task
    - validation_commands
    - failure_policy
    - parent_client
    task_ids_rule: exact-ordered-unique-minimum-two
    target_rule: target_task_id-equals-task_id-and-is-member-of-task_ids
    per_task_maps_rule: exact-keyset-equals-task_ids-and-target-values-match-projection
    current_catalog_rule: all-task-versions-owner-outputs-acceptance-validation-and-package-scope-must-match-current-catalog
    qoder_only_fields_forbidden:
    - permission_mode
    - _resume_mode
    - title
    raw_json_rule: duplicate-keys-rejected-noncanonical-whitespace-accepted-and-hash-bound
  runner_bound_identity:
    parent_session_id:
      source: caller-or-CODEX_THREAD_ID
      required_in_persisted_task: true
    agent_id:
      source: runner-generated-at-dispatch
      caller_must_omit: true
    run_id:
      source: runner-generated-at-dispatch
      caller_must_omit: true
    session_id:
      source: runner-generated-or-resume-record
      caller_must_omit_on_start: true
    client:
      source: runner-forced
      value: qoder
  result_required_output:
  - status
  - work_package_id
  - task_ids
  - task_versions
  - change_versions
  - run_id
  - outcomes
  - changed_files
  - validation
  - acceptance_evidence
  - effect_checks
  - risks
  current_runner_adapter:
    enforced_caller_fields:
    - goal
    - task_id
    - task_source
    - task_version
    - change_version
    - work_package_id
    - task_ids
    - task_versions
    - change_versions
    - estimated_minutes
    - primary_owner
    - contract_boundary
    - agent_profile
    - harness_manifest
    - allowed_files
    - forbidden_files
    - required_context
    - expected_output
    - acceptance_criteria
    - acceptance_evidence
    - validation_command
    - failure_policy
    - parent_client
    target_schema_enforced: true
    runtime_identity_enforced: true
    result_fields_required_in_prompt: true
    agent_profile_cli_binding: true
    harness_manifest_preflight: true
    catalog_package_preflight: advisory-when-present
    catalog_estimate_rule: caller-10-to-360-or-exact-current-catalog-sum-when-catalog-is-used
    structured_result_required: true
    implementation_status: IMPLEMENTED
    conformance_test: tests/agents/test_qoder_runner.py
    owner_task: LF-TSK-QLT-0006
    owner_task_version: 2
    owner_change_version: 2.0.0
  caller_field_schema:
    goal: non-empty-string
    task_id: stable-task-id-string
    task_source: non-empty-string
    task_version: positive-integer
    change_version: semver-string
    work_package_id: stable-work-package-id-string
    task_ids: ordered-unique-list-minimum-one
    task_versions: exact-task-id-to-positive-integer-map
    change_versions: exact-task-id-to-semver-map
    estimated_minutes: integer-10-to-360
    primary_owner: non-empty-string
    contract_boundary: non-empty-string
    agent_profile: project-qoder-agent-name
    harness_manifest: repository-relative-hash-bound-json
    allowed_files: non-empty-string
    forbidden_files: non-empty-string
    required_context: non-empty-string
    expected_output: non-empty-string
    acceptance_criteria: non-empty-list-of-strings
    acceptance_evidence: non-empty-list-of-strings
    validation_command: non-empty-string
    failure_policy: non-empty-string
    parent_client: exact-string-codex
  codex_runtime_binding:
    schema_version: lexiflow.codex-runtime-binding.v1
    implementation: scripts/agents/codex/runtime_binding.py
    actor_source: owned-local-session-metadata-cross-checked-with-runtime-route
    local_adapter: scripts/agents/local_codex_runtime.py
    local_trust_boundary: trusted-local-user-not-platform-cryptographic-attestation
    local_actor_id: codex-session-<actual-session-uuid>
    actor_stability: same-actual-agent-across-runs-and-attestations
    session_source: actual-session-metadata-id-matching-CODEX-SESSION-ID-or-CODEX-THREAD-ID
    parent_source: local-root-task-session-or-explicit-protected-host-route
    shared_host_session: forbidden-for-local-issuer-independence
    protected_host_adapter: explicit-integration-only-not-default-local-CLI
    caller_identity_injection: forbidden
    missing_runtime: BLOCKED
    fabricated_or_conflicting_runtime: FAIL
    binding_publication: immutable-before-projection-and-completion
    identity_authentication: local-source-provenance-not-JSON-structure-or-self-report
  acceptance_submission:
    implementation: scripts/delivery_gate/submit.py
    source: fixed-current-verification-report-and-target-task
    producer_facts_owner: scripts/agents/
    delegated_producer: explicit-run-id-with-verified-task-completion-and-result
    inputs: verification-report-id-task-id-explicit-scope-confirmation
    subprocess_log_inference_or_legacy_fallback: forbidden
    formal_receipt_issuance: public-acceptance-scenarios-only
  codex_main_task_projection:
    schema_version: lexiflow.codex-main-task-projection.v1
    executor: runtime-bound-main-task
    canonical_actor_id: codex-session-<actual-session-uuid>
    protected_host_actor_id: /root
    cardinality: one-current-catalog-task
    delegated_projection: mutually-exclusive-minimum-two-tasks-unchanged
    caller_identity_or_executor_kind_authority: forbidden
    identity_source: same-immutable-codex-runtime-binding
    self-validation-or-self-review: forbidden
    materializer: scripts/agents/local_codex_runtime.py

# 派发路由与失败预算；固定值被 runner 消费，不能把描述性翻译用于替换协议值。
agent_dispatch:
  primary: qoder
  fallback_model: gpt-6-sol
  fallback_reasoning_effort: high
  model_selection_basis: explicit-user-required-sol-fallback
  max_consecutive_failures: 3
  failure_unit: qoder-and-terra-both-unavailable-in-one-dispatch-attempt
  success_effect: reset-consecutive-failures-preserve-history
  identity: current-parent-repo-work-package-ordered-task-versions
  replay_effect: no-new-attempt-or-counter-increment
  unknown_start_effect: preserve-attempt-no-fallback-no-redispatch
  execution_and_review_failures: separate-from-dispatch-failures
  stop_effect: stop-package-dispatch-no-fourth-attempt-not-goal-status-change
  host_wait_policy: reject-active-or-unknown-goal-without-supported-wait-adapter
  host_wait_evidence: current-runtime-derived-read-only-goal-state
  host_wait_caller_override: forbidden
  host_mutations: forbidden
  fallback_execution_owner: current-parent-native-codex-collaboration-tool
  fallback_result_evidence: identity-bound-native-tool-result-not-self-reported-pass
  codex_wait: native-collaboration-events-not-qoder-terminal-callback
  safety_preconditions: identity-write-scope-no-duplicate-execution

# Qoder 专属生命周期：先核对宿主等待资格，再运行；终态 callback 才能续办。
qoder_delegation:
  default_implementer: qoder
  default_permission_mode: bypass_permissions
  max_active_runs: 1
  concurrency_scope: host-os-user-all-checkouts
  concurrency_enforcement: inherited-exclusive-host-file-lock-through-cli-exit
  scheduling:
    overflow: queue
    next_run_requires_confirmed_completion: true
    unknown_status_blocks_dispatch: true
    codex_independent_work_allowed: true
    integration_validation: serial
  busy_routing:
    schema: lexiflow.qoder-busy-routing.v1
    report_fields: [caller.repo, caller.session_id, owner.repo, owner.session_id, owner.run_id, ownership, next_action]
    trusted_same_session_inflight: end-current-turn-await-callback
    same_repo_other_session: fallback-to-codex-subagent
    cross_repo_or_external_or_unknown: fallback-to-codex-subagent
    stale_owner_record: fallback-to-codex-subagent
    owner_evidence: current-trusted-codex-runtime-plus-runner-bound-task-plus-awaiting-continuation-plus-live-qoder-session-process
    forbidden_owner_evidence: [pid-only, stale-lock-file, saved-resume-parent-session, external-cli-arguments]
    fallback_preserves: [work_package_id, task_ids, task_versions, change_versions, acceptance, executed_records]
    fallback_cannot_bypass: [compatible-write-scope, duplicate-dispatch-protection, host-wide-max-active-runs]
  max_rework_rounds: 1
  max_total_runs_per_task_before_main_review: 2
  run_budget_scope: qoder-execution-history-not-combined-dispatch-failure-counter
  exhausted_budget_recovery:
    rule: 预算耗尽先由 Main 只读复核历史完成记录与当前输入；这不是整个 Catalog Task 永久禁止推进，也不是再次 Qoder 派发许可。
    continuation: 复核后保持原稳定 Task identity 与历史数据，按既有规模和身份合同选择 Main 或 Codex 接手；委派遵守当前模型策略，接手者不得自签 validation/review。
    forbidden: 不得为重置预算而新建同义 Task、改 anchor/package/version、删除运行数据或伪造恢复确认；只有范围真实改变才按变更合同更新版本。
  max_prompt_characters: 8000
  work_package:
    estimated_minutes:
      min: 10
      max: 360
    estimated_minutes_source: caller-declared-estimate-or-exact-current-catalog-sum-when-catalog-is-used
    minimum_catalog_tasks: 1
    must_share:
    - primary_owner
    - contract_boundary
    package_scope_source: caller-declared-scope-or-exact-current-catalog-union-when-catalog-is-used
    package_claims_source: caller-declared-scope-or-current-catalog-claims-when-catalog-is-used
    task_permission_source: declared-core-handoff-and-current-catalog-when-catalog-is-used
    execution_within_run: sequential
    per_task_outcome_evidence_required: true
  harness_preflight:
    agent_profile_bound_with_cli: true
    manifest_schema: lexiflow.qoder-harness.v1
    required:
    - hashed-context
    - required-tools
    - argv-validation-commands
    - exact-package-identity
    - core-handoff-identity-scope-acceptance-and-validation
    - start-readiness-snapshot-of-terminal-history-attempt-budget-known-access-blockers-and-processes
    catalog_reconciliation: advisory-when-present-not-a-dispatch-prerequisite
    readiness_boundary: 只读快照不分配 run、不占锁、不验证在线账号健康；BLOCKED 非零退出，start/resume 必须在派发锁内重新检查。
  structured_result:
    schema: lexiflow.qoder-work-package-result.v1
    result_json_required_before_completion: true
    exit_zero_without_valid_result: failed
  prompt_context_policy: "使用有界的文件 locator；handoff 不重复粘贴设计文档。"
  recursive_delegation: forbidden
  completion_callback:
    transport: codex-queue
    target: exact-parent-session-uuid
    completion_record_first: true
    queued_is_delivery_proof: false
  lifecycle:
    llm_polling_forbidden: true
    parent_after_dispatch: end-current-turn-await-callback
    llm_fallback_probes: forbidden
    pending_result_query: refuse-with-continuation-and-exit-3
    no_llm_watchdog:
      initial_delay_seconds: 300
      interval_seconds: 600
      max_lifetime_seconds: 86400
      unchanged_state_is_silent: true
    watchdog_no_llm: true
    explicit_ack_required: true
    ack_is_not_pass: true
    result_and_status_read_only: true

# 客户端兼容投影的调度字段，值与既有模板一致。

# Codex 原生协作：沿用工作包合同，通过 native collaboration event 收取结果。
codex_dispatch:
  max_active_subagents: 1
  default_fork_turns: none
  full_history_fork_requires_explicit_exception: true
  completion_signal_fields:
  - status
  - work_package_id
  - task_ids
  - run_id
  - artifact_locators
  - validation_commands
  - blocking_findings
  max_blocking_findings: 3
  full_context_or_logs_in_callback: false
