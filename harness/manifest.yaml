schemaVersion: 1
project:
  name: lexiflow
  type: modular-monolith-product
  description: 面向流媒体内容的个性化英文语境提示。
architecture:
  deployment_units:
  - api
  - worker
  source_of_truth: postgresql
  rebuildable_state:
  - redis
  - browser-cache
  - projections
  first_client: chrome-extension
  first_content_adapter: youtube
agent_contract:
  policy_manifest: harness/agent-policy.manifest.yaml
  runtime_manifest: harness/agent-runtime.manifest.yaml
  module_boundaries: harness/module-boundaries.yaml
  java_product: harness/java-product.manifest.yaml
  documentation_policy: harness/documentation-policy.yaml
  policy_projections: harness/policy-projections.yaml
  qoder_harness_schema: harness/qoder-harness.schema.json
  qoder_result_schema: harness/qoder-result.schema.json
  validation_mode: explicit
  planning_system: openspec
  platform_entries:
    codex_agents: .codex/agents/
    qoder_agents: .qoder/agents/
  acceptance_records_schema: harness/acceptance-records.schema.json
public_executables:
  docs_check: python3 -m scripts.repository.docs_check
  policy_projection: python3 -m scripts.repository.policy_projection
  local_skills: python3 -m scripts.repository.local_skills
  hooks: python3 -m scripts.repository.hooks
  local_codex_runtime: python3 -m scripts.agents.local_codex_runtime
  change_verify: python3 scripts/check_changes.py
  repository_verify: python3 scripts/check_repository.py
  planning_check: python3 -m scripts.repository.planning_check --root .
  qoder_task: python3 scripts/agents/qoder_task.py
  acceptance: python3 -m scripts.acceptance submit|validate|review|check|status
script_governance:
  durable_script_roots:
  - scripts/repository/
  - scripts/agents/
  - scripts/verification/
  - scripts/acceptance/
  - scripts/environment/
  durable_requires:
  - reusable-repository-contract
  - stable-command-or-library-consumer
  - direct-test-coverage
  phase_only_root: tmp/phase-tools/
  phase_only_rules:
  - ignored
  - no-registry-entry
  - no-public-manifest-entry
  - no-product-runtime-import
  promotion: explicit-user-approved-contract-and-tests
quality:
  delivery_command: python3 scripts/check_changes.py
  repository_baseline_command: python3 scripts/check_repository.py
  full_command: python3 -m scripts.acceptance validate --submission-id <submission-id>
  layering:
    submit: binds-PASS-change-verify-task-requirements-and-producer-runtime
    validate: independent-verification-public-api-on-frozen-input
    review: consumes-frozen-validation-and-explicit-review-opinion
    check: consumes-validation-review-dependency-hash-DAG
  result_values:
  - PASS
  - BLOCKED
  - FAIL
docs:
- docs/README.md
- docs/product/product-brief.md
- docs/architecture/overview.md
- docs/architecture/boundaries.md
- docs/architecture/flows.md
- docs/architecture/semantic-contract.md
- docs/architecture/data-model.md
- docs/architecture/lexicon-contract.md
- docs/architecture/caption-contract.md
- docs/architecture/data-contracts.md
- docs/architecture/runtime-safety.md
- docs/architecture/source-contract.md
- docs/architecture/decisions.md
- docs/development/validation.md
- docs/development/gate-control-plane.md
- docs/development/repository-glossary.md
- docs/development/toolchain-reproduction.md
- docs/roadmap/master-plan.md
- docs/roadmap/phase-1-status.md
- docs/roadmap/phase-2-status.md
- openspec/specs/product-architecture/spec.md
- openspec/specs/agent-execution/spec.md
local_only:
- .env
- .local/
- tmp/
- data/
- secrets/
