# Harness 入口索引：公开命令、长期脚本边界和读者导航；不在这里保存运行结果。
schemaVersion: 1
project:
  name: lexiflow
  type: modular-monolith-product
  description: 基于已发布词库资料的低打扰英文语境提示。
architecture:
  deployment_units:
  - api
  - worker
  source_of_truth: postgresql
  rebuildable_state:
  - redis
  - browser-cache
  - projections
  first_client: chrome-extension
  first_content_adapter: youtube
agent_contract:
  policy_manifest: harness/agent-policy.manifest.yaml
  runtime_manifest: harness/agent-runtime.manifest.yaml
  module_boundaries: harness/module-boundaries.yaml
  java_product: harness/java-product.manifest.yaml
  documentation_policy: harness/documentation-policy.yaml
  policy_projections: harness/policy-projections.yaml
  delivery_hooks: harness/delivery-hooks.json
  test_services: harness/test-services.json
  python_quality: harness/python-quality.toml
  python_docstrings: harness/python-docstrings.toml
  qoder_harness_schema: harness/qoder-harness.schema.json
  qoder_result_schema: harness/qoder-result.schema.json
  validation_mode: explicit
  planning_system: openspec
  platform_entries:
    codex_agents: .codex/agents/
    qoder_agents: .qoder/agents/
    codex_hooks: .codex/hooks.json
    qoder_hooks: .qoder/settings.json
  delivery_gate_records_schema: harness/delivery-gate-records.schema.json
public_executables:
  java_exec: python3 -m scripts.environment.java_exec <native-command>
  local_api: python3 -m scripts.environment.start_api
  docs_check: python3 -m scripts.repository.docs_check
  policy_projection: python3 -m scripts.repository.policy_projection
  local_skills: python3 -m scripts.repository.local_skills
  python_quality: python3 -m scripts.repository.python_quality
  delivery_hook: python3 scripts/verification/delivery_hook.py
  hooks: python3 -m scripts.repository.hooks
  local_codex_runtime: python3 -m scripts.agents.local_codex_runtime
  change_verify: python3 scripts/check_changes.py
  repository_verify: python3 scripts/check_repository.py
  verification_diagnose: python3 -m scripts.verification.diagnose change|repository
  planning_check: python3 -m scripts.repository.planning_check
  qoder_delegation: python3 -m scripts.agents.delegation.qoder_cli
  codex_work_package_verify: python3 -m scripts.agents.delegation.codex_cli verify --run-id <run_id>
  delivery_gate: python3 -m scripts.delivery_gate submit|validate|review|check|status
script_governance:
  durable_script_roots:
  - scripts/repository/
  - scripts/agents/
  - scripts/verification/
  - scripts/delivery_gate/
  - scripts/environment/
  durable_requires:
  - reusable-repository-contract
  - stable-command-or-library-consumer
  - direct-test-coverage
  phase_only_root: tmp/phase-tools/
  phase_only_rules:
  - ignored
  - no-registry-entry
  - no-public-manifest-entry
  - no-product-runtime-import
  promotion: explicit-user-approved-contract-and-tests
quality:
  delivery_command: python3 scripts/check_changes.py
  repository_baseline_command: python3 scripts/check_repository.py
  full_command: python3 -m scripts.delivery_gate validate --submission-id <submission-id>
  layering:
    submit: binds-PASS-change-verify-task-requirements-and-producer-runtime
    validate: independent-verification-public-api-on-frozen-input
    review: consumes-frozen-validation-and-explicit-review-opinion
    check: consumes-validation-review-dependency-hash-DAG
  result_values:
  - PASS
  - BLOCKED
  - FAIL
docs:
- docs/README.md
- docs/product/product-brief.md
- docs/product/glossary.md
- docs/architecture/overview.md
- docs/architecture/flows.md
- docs/development/overview.md
- docs/development/change-delivery.md
- docs/development/agent-workflow.md
- docs/development/operations.md
- docs/development/reference.md
- docs/development/troubleshooting.md
- docs/roadmap/master-plan.md
- docs/roadmap/master-plan/foundation.md
- docs/roadmap/master-plan/performance.md
- docs/roadmap/master-plan/improvement.md
- docs/roadmap/master-plan/status.md
- openspec/specs/product-architecture/spec.md
- openspec/specs/agent-execution/spec.md
local_only:
- .env
- .local/
- tmp/
- data/
- secrets/
