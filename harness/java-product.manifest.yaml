# Java 产品构建与检查的唯一技术入口；Python 只编排证据，不复刻 Java 扫描。
schema_version: lexiflow.java-product.v1
status: active
backend:
  language: java
  java_release: 25
  distribution: Eclipse Temurin
  build:
    tool: gradle-wrapper
    version: 9.7.1
    dsl: kotlin
  framework:
    name: spring-boot
    version: 4.1.1
    allowed_layers: [composition-root, inbound-adapter, outbound-adapter]
    forbidden_layers: [domain, application]
  runtimes: [api, worker]

# 产品源码只允许 Java；Python 范围另列。
source_policy:
  product_roots:
  - backend/apps
  - backend/application
  - backend/modules
  - backend/platform
  allowed_product_source_extensions: [.java]
  forbidden_product_source_extensions: [.py, .kt, .scala, .groovy]
python_scope:
  allowed: [scripts, harness, gates, generators, audit, tests-for-python-tooling]
  forbidden: [product-domain, product-application, product-api, product-worker]

# delivery 命令用于交付，diagnostic_targets 仅用于定位故障，不叠加成为新阶段。
verification:
  launcher: python3 -m scripts.environment.java_exec
  jdk_resolution: explicit-lexiflow-home-then-repository-local-then-exact-java-home
  execution_owner: gradle-java
  gate_orchestration: receipt-only
  incremental_delivery: python3 -m scripts.environment.java_exec backend/gradlew -p backend check
  full_delivery: python3 -m scripts.environment.java_exec backend/gradlew -p backend deliveryFull
  gate_selection:
    incremental: [check]
    full: [deliveryFull]
    excluded_diagnostics: [architectureTest, verifyProductLanguage]
  diagnostic_targets:
    architecture: python3 -m scripts.environment.java_exec backend/gradlew -p backend architectureTest
    language_boundary: python3 -m scripts.environment.java_exec backend/gradlew -p backend verifyProductLanguage
  rule_owners:
    formatting: Spotless
    style: Checkstyle
    static_analysis: PMD
    java_source_policy: javaSourceGates
    public_api_javadoc_contract: javaSourceGates
    architecture: ArchUnit-and-Gradle-dependency-guard
    behavior: JUnit-and-Spring-test-suites
